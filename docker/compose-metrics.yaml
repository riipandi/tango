# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

x-common: &common
  networks: ['intranet']
  extra_hosts: ['host.docker.internal:host-gateway']
  restart: unless-stopped
  security_opt: ['no-new-privileges:true']
  shm_size: 128m # set shared memory limit
  mem_limit: 256m # set memory limit

services:
  perses:
    <<: *common
    # @ref: https://perses.dev/perses/docs/configuration/configuration
    image: docker.io/persesdev/perses:${PERSES_VERSION:-v0.55-distroless}
    hostname: perses
    ports: ['3380:3380']
    volumes: ['../.storage/perses_data:/perses:rw', './perses:/etc/perses/provisioning:ro']
    configs: [{ source: perses_config, target: /etc/perses/config.yaml }]
    command: '-web.listen-address=0.0.0.0:3380 -log.level=error --config=/etc/perses/config.yaml'
    healthcheck:
      test: ['CMD', 'percli', 'version']
      interval: 3s
      timeout: 5s
      retries: 3
    depends_on:
      victoria-metrics: { condition: service_healthy }
      victoria-logs: { condition: service_started }
      victoria-traces: { condition: service_started }
      otel-collector: { condition: service_started }

  perses-mcp:
    <<: *common
    image: docker.io/persesdev/mcp-server:${PERSES_MCP_VERSION:-v0.2-distroless}
    hostname: perses-mcp
    ports: ['3880:3880']
    configs: [{ source: perses_mcp_config, target: /etc/perses-mcp-config.yaml }]
    command: '--config=/etc/perses-mcp-config.yaml'
    depends_on:
      perses: { condition: service_healthy }

  otel-collector:
    <<: *common
    image: docker.io/otel/opentelemetry-collector-contrib:${OTELCOL_VERSION:-0.140.0}
    hostname: otel-collector
    ports:
      - '4318:4318' # OTLP/HTTP, the endpoint the application dials by default
      - '4317:4317' # OTLP/gRPC, for otel.protocol: grpc
      - '13133:13133' # health_check extension
    volumes: ['./otelcol.yaml:/etc/otelcol/config.yaml:ro']
    command: ['--config=/etc/otelcol/config.yaml']
    healthcheck:
      test: ['CMD', '/otelcol-contrib', '--version']
      interval: 3s
      timeout: 5s
      retries: 3
    depends_on:
      victoria-logs: { condition: service_started }
      victoria-metrics: { condition: service_healthy }
      victoria-traces: { condition: service_started }

  # VictoriaLogs v1.52+ and VictoriaTraces v0.11+ are distroless: no shell, no HTTP
  # client, so an exec healthcheck cannot run and every `depends_on:
  # service_healthy` behind it never starts. They carry none, their dependents wait
  # for `service_started`, and `task metrics:health` probes them from the host.
  # Restore the healthchecks once `-health` ships (VictoriaLogs#1741).

  victoria-metrics:
    <<: *common
    image: docker.io/victoriametrics/victoria-metrics:${VICTORIA_METRICS_VERSION:-v1.152.0}
    hostname: victoria-metrics
    ports: ['33802:8428']
    volumes: ['../.storage/victoria_metrics_data:/victoria_metrics_data']
    configs: [{ source: victoria_metrics_config, target: /victoria_metrics_data/scrape.yaml }]
    command: >-
      -storageDataPath=/victoria_metrics_data
      -promscrape.config=/victoria_metrics_data/scrape.yaml
    healthcheck:
      test: ['CMD', 'nc', '-vz', '127.0.0.1', '8428']
      interval: 3s
      timeout: 5s
      retries: 3
    depends_on:
      postgres-exporter: { condition: service_healthy }

  victoria-logs:
    <<: *common
    image: docker.io/victoriametrics/victoria-logs:${VICTORIA_LOGS_VERSION:-v1.52.0}
    hostname: victoria-logs
    ports: ['33801:9428']
    volumes: ['../.storage/victoria_logs_data:/victoria_logs_data']
    command: >-
      -storageDataPath=/victoria_logs_data
      -retentionPeriod=14d
      -opentelemetry.maxRequestSize=16777216

  victoria-traces:
    <<: *common
    image: docker.io/victoriametrics/victoria-traces:${VICTORIA_TRACES_VERSION:-v0.11.1}
    hostname: victoria-traces
    ports: ['33803:10428']
    volumes: ['../.storage/victoria_traces_data:/victoria_traces_data']
    command: >-
      -storageDataPath=/victoria_traces_data
      -retentionPeriod=8w

  postgres-exporter:
    <<: *common
    image: quay.io/prometheuscommunity/postgres-exporter:${PG_EXPORTER_VERSION:-latest}
    hostname: postgres-exporter
    ports: ['9187:9187']
    environment:
      DATA_SOURCE_URI: pgsql:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: securedb
    healthcheck:
      test: ['CMD', 'nc', '-vz', '127.0.0.1', '9187']
      interval: 3s
      timeout: 5s
      retries: 3
    depends_on:
      pgsql: { condition: service_healthy }

  redis-exporter:
    <<: *common
    image: docker.io/cleanstart/redis-exporter:${REDIS_EXPORTER_VERSION:-latest}
    hostname: redis-exporter
    ports: ['9121:9121']
    environment:
      REDIS_USER: default
      REDIS_PASSWORD: securedb
      REDIS_ADDR: redis://valkey:6379
      REDIS_EXPORTER_WEB_LISTEN_ADDRESS: 0.0.0.0:9121
    healthcheck:
      test: ['CMD', '/usr/bin/redis_exporter', '--version']
      interval: 3s
      timeout: 5s
      retries: 3
    depends_on:
      valkey: { condition: service_healthy }

  # The edge proxy's metrics, read from the stub_status the nginx config
  # publishes on the 9180 server. stub_status is aggregate: connections and a
  # request counter, no status-code split — a 502 the proxy returns never
  # reaches a handler that could count it, so a latency or refusal question
  # about the edge is answered from its access log, not this job.
  nginx-exporter:
    <<: *common
    image: docker.io/nginx/nginx-prometheus-exporter:${NGINX_EXPORTER_VERSION:-1.4}
    hostname: nginx-exporter
    ports: ['9113:9113']
    command: ['--nginx.scrape-uri=http://nginx:9180/stub_status']
    depends_on:
      nginx: { condition: service_started }

# ================================================================================================
# Configuration file
# Behind Cloudflare: proxy_set_header X-Client-IP $http_cf_connecting_ip;
# ================================================================================================

configs:
  perses_config:
    content: |
      security:
        readonly: false
        enable_auth: false
        encryption_key: ef7b4e8c2595a15f9872c01144dc4ff8
      database:
        file:
          folder: '/perses'
          extension: 'json'
      plugin:
        disabled: []
      dashboard:
      datasource:
        project:
          disable: true
        disable_local: true
      provisioning:
        folders:
          - '/etc/perses/provisioning'

  perses_mcp_config:
    content: |
      transport: http
      listen_address: "0.0.0.0:3880"
      read_only: false
      resources: ""
      perses_server:
        url: "http://perses:3380"

  victoria_metrics_config:
    content: |
      scrape_configs:
        - job_name: victoria-metrics
          static_configs:
            - targets: ['http://localhost:8428/metrics']
        - job_name: postgres-db
          static_configs:
            - targets: ['postgres-exporter:9187']
              labels:
                instance: pg-server-01
        - job_name: redis-db
          static_configs:
            - targets: ['redis-exporter:9121']
              labels:
                instance: redis-server-01
          metrics_path: /scrape
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: redis-exporter:9121
        - job_name: redis-exporter
          static_configs:
            - targets: ['redis-exporter:9121']
        # The collector's own pipeline (accepted, dropped, sent) — the first
        # place to look when a signal stops arriving.
        - job_name: otel-collector
          static_configs:
            - targets: ['otel-collector:8888']
        # The edge: nginx is in front of everything external, so its failure
        # modes (upstream 502s never reach the application) need their own job.
        - job_name: nginx
          static_configs:
            - targets: ['nginx-exporter:9113']
              labels:
                instance: nginx-proxy-01
        # The Go server publishes metrics on the port it serves; the target is
        # the host running `task dev`, reached through the extra_hosts entry.
        - job_name: tango
          static_configs:
            - targets: ['host.docker.internal:3080']
          metrics_path: /metrics

volumes:
  victoria_metrics_data:
  victoria_logs_data:
  victoria_traces_data:
  perses_data:
