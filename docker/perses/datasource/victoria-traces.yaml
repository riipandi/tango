# The trace store. VictoriaTraces exposes the Jaeger query API, which is what
# this datasource speaks, so traces are readable without a collector in front 
# of it.
kind: "GlobalDatasource"
metadata:
  name: "victoria-traces"
spec:
  display:
    name: "VictoriaTraces"
  default: true
  plugin:
    kind: "JaegerDatasource"
    spec:
      # No directUrl: the browser queries the Perses proxy instead of the store,
      # which has no CORS headers of its own.
      proxy:
        kind: "HTTPProxy"
        spec:
          url: "http://victoria-traces:10428/select/jaeger"
