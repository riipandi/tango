# The metrics store this application is scraped into. A global datasource rather
# than a project one: this stack has no projects, and the perses config switches
# project-scoped datasources off, so a datasource defined inside a project would
# be provisioned into nothing.
kind: "GlobalDatasource"
metadata:
  name: "victoria-metrics"
spec:
  display:
    name: "VictoriaMetrics"
  default: true
  plugin:
    kind: "PrometheusDatasource"
    spec:
      # No directUrl: the browser queries the Perses proxy instead of the store,
      # which has no CORS headers of its own.
      scrapeInterval: "15s"
      proxy:
        kind: "HTTPProxy"
        spec:
          url: "http://victoria-metrics:8428"
