# yaml-language-server: $schema=https://raw.githubusercontent.com/perses/perses/main/schemas/globaldatasource.json
#
# The trace store. VictoriaTraces exposes the Jaeger query API, which is what
# this datasource speaks, so traces are readable without a collector in front of
# it.
kind: "GlobalDatasource"
metadata:
  name: "victoria-traces"
spec:
  display:
    name: "VictoriaTraces"
  default: true
  plugin:
    kind: "JaegerDatasource"
    spec:
      directUrl: "http://localhost:10428/select/jaeger"
