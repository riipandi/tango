# The PostgreSQL the application runs on, read from postgres-exporter. The
# instance label is the one the VictoriaMetrics scrape config names
# (pg-server-01); the datname label on the stat_database series is the
# database, so the panels break a multi-database server down per database.
#
# Native provisioning format: kind Dashboard with a project.
kind: Dashboard
metadata:
    name: postgres-database
    project: tango
spec:
    display:
        name: PostgreSQL Database
    duration: 3h
    refreshInterval: 30s
    variables:
        - kind: ListVariable
          spec:
              display:
                  name: Instance
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: instance
                      matchers:
                          - pg_up
              name: instance
        - kind: ListVariable
          spec:
              display:
                  name: Database
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: datname
                      matchers:
                          - pg_stat_database_xact_commit{instance=~"$instance"}
              name: datname
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'pg_up{instance=~"$instance"}'
        connections:
            kind: Panel
            spec:
                display:
                    name: Connections by state
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (state) (pg_stat_activity_count{instance=~"$instance", datname=~"$datname"})'
        transactions:
            kind: Panel
            spec:
                display:
                    name: Transactions per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(pg_stat_database_xact_commit{instance=~"$instance", datname=~"$datname"}[5m])'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(pg_stat_database_xact_rollback{instance=~"$instance", datname=~"$datname"}[5m])'
        cache-hit-ratio:
            kind: Panel
            spec:
                display:
                    name: Cache hit ratio
                    description: Blocks read from the buffer cache against blocks read from disk. Below ~0.99 on a busy database is a memory question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: percent
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(pg_stat_database_blks_hit{instance=~"$instance", datname=~"$datname"}[5m]) / (rate(pg_stat_database_blks_hit{instance=~"$instance", datname=~"$datname"}[5m]) + rate(pg_stat_database_blks_read{instance=~"$instance", datname=~"$datname"}[5m]))'
        deadlocks:
            kind: Panel
            spec:
                display:
                    name: Deadlocks
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(pg_stat_database_deadlocks{instance=~"$instance", datname=~"$datname"}[5m])'
        database-size:
            kind: Panel
            spec:
                display:
                    name: Database size
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (datname) (pg_database_size_bytes{instance=~"$instance"})'
        temp-bytes:
            kind: Panel
            spec:
                display:
                    name: Temp files written
                    description: Bytes written to temporary files — the signature of a sort or a hash that spilled.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(pg_stat_database_temp_bytes{instance=~"$instance", datname=~"$datname"}[5m])'
        locks:
            kind: Panel
            spec:
                display:
                    name: Locks held by mode
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (mode) (pg_locks_count{instance=~"$instance", datname=~"$datname"})'
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/up'
                  - x: 6
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/database-size'
                  - x: 15
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/cache-hit-ratio'
                  - x: 0
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/connections'
                  - x: 8
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/transactions'
                  - x: 16
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/deadlocks'
                  - x: 0
                    y: 12
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/temp-bytes'
                  - x: 8
                    y: 12
                    width: 16
                    height: 8
                    content:
                        $ref: '#/spec/panels/locks'
