apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
    namespace: ""
    name: postgres-database
spec:
    display:
        name: PostgreSQL Database
    variables:
        - kind: ListVariable
          spec:
            display:
                name: datasource
                hidden: false
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: DatasourceVariable
                spec:
                    datasourcePluginKind: PrometheusDatasource
            name: DS_VICTORIA_METRICS
        - kind: ListVariable
          spec:
            display:
                name: Interval
                hidden: false
            defaultValue: $__auto_interval_interval
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: StaticListVariable
                spec:
                    values:
                        - label: auto
                          value: $__auto_interval_interval
                        - 1s
                        - 5s
                        - 1m
                        - 5m
                        - 1h
                        - 6h
                        - 1d
            name: interval
        - kind: ListVariable
          spec:
            display:
                name: Namespace
                hidden: false
            allowAllValue: false
            allowMultiple: false
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    expr: query_result(pg_exporter_last_scrape_duration_seconds)
                    labelName: migration_from_grafana_not_supported
            name: namespace
        - kind: ListVariable
          spec:
            display:
                name: Release
                hidden: false
            allowAllValue: false
            allowMultiple: false
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    expr: query_result(pg_exporter_last_scrape_duration_seconds{kubernetes_namespace="$namespace"})
                    labelName: migration_from_grafana_not_supported
            name: release
        - kind: ListVariable
          spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: false
            allowMultiple: false
            sort: alphabetical-asc
            plugin:
                kind: PrometheusPromQLVariable
                spec:
                    expr: query_result(pg_up{release="$release"})
                    labelName: migration_from_grafana_not_supported
            name: instance
        - kind: ListVariable
          spec:
            display:
                name: Database
                hidden: false
            allowAllValue: true
            allowMultiple: true
            sort: alphabetical-asc
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: datname
                    matchers: []
            name: datname
        - kind: ListVariable
          spec:
            display:
                name: Lock table
                hidden: false
            allowAllValue: true
            allowMultiple: true
            sort: none
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: mode
                    matchers:
                        - '{mode=~"accessexclusivelock|accesssharelock|exclusivelock|rowexclusivelock|rowsharelock|sharelock|sharerowexclusivelock|shareupdateexclusivelock"}'
            name: mode
    panels:
        "0_0":
            kind: Panel
            spec:
                display:
                    name: Version
                plugin:
                    kind: Markdown
                    spec:
                        text: '**Migration from Grafana not supported !**'
        "0_1":
            kind: Panel
            spec:
                display:
                    name: Start Time
                    description: start time of the process
                plugin:
                    kind: Markdown
                    spec:
                        text: '**Migration from Grafana not supported !**'
        "0_2":
            kind: Panel
            spec:
