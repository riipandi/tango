# The Go runtime and the process, read from the Prometheus bridge the observer
# serves at otel.metrics.prometheus_path. The collectors are registered
# deliberately in internal/observer — go_* and process_* are what this service
# is — and the instrumentation is the OTel Go SDK's, whose names follow.
#
# Native provisioning format: kind Dashboard with a project.
kind: Dashboard
metadata:
    name: go-runtime-metrics
    project: tango
spec:
    display:
        name: Go Runtime Metrics
    duration: 3h
    refreshInterval: 30s
    variables:
        - kind: ListVariable
          spec:
              display:
                  name: Instance
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: instance
                      matchers:
                          - go_goroutines
              name: instance
    panels:
        goroutines:
            kind: Panel
            spec:
                display:
                    name: Goroutines
                    description: The number of goroutines that currently exist.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'go_goroutines{instance=~"$instance"}'
        threads:
            kind: Panel
            spec:
                display:
                    name: OS threads
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'go_threads{instance=~"$instance"}'
        heap-in-use:
            kind: Panel
            spec:
                display:
                    name: Heap in use
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'go_memstats_heap_inuse_bytes{instance=~"$instance"}'
        sys-memory:
            kind: Panel
            spec:
                display:
                    name: Memory reserved from the OS
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'go_memstats_sys_bytes{instance=~"$instance"}'
        gc-pause:
            kind: Panel
            spec:
                display:
                    name: GC pause (p99)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: seconds
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'go_gc_duration_seconds{instance=~"$instance", quantile="0.99"}'
        process-cpu:
            kind: Panel
            spec:
                display:
                    name: Process CPU
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                        yAxis:
                          format:
                            unit: seconds
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(process_cpu_seconds_total{instance=~"$instance"}[5m])'
        rss:
            kind: Panel
            spec:
                display:
                    name: Resident memory
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'process_resident_memory_bytes{instance=~"$instance"}'
        file-descriptors:
            kind: Panel
            spec:
                display:
                    name: Open file descriptors
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'process_open_fds{instance=~"$instance"}'
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/goroutines'
                  - x: 6
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/threads'
                  - x: 12
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/gc-pause'
                  - x: 18
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/file-descriptors'
                  - x: 0
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/heap-in-use'
                  - x: 8
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/sys-memory'
                  - x: 16
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/rss'
                  - x: 0
                    y: 12
                    width: 24
                    height: 8
                    content:
                        $ref: '#/spec/panels/process-cpu'
