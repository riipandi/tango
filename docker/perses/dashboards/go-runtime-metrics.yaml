# What the Go runtime itself costs and how it manages memory: GC cadence and pauses,
# heap classes, scheduler load, and descriptors. These come from the runtime/metrics
# collectors registered in the observer's private registry, scraped from the same
# /metrics endpoint as the application's own instruments (job="tango").
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: go-runtime-metrics
    project: tango
spec:
    display:
        name: Go Runtime Metrics
    duration: 3h
    refreshInterval: 15s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: true
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - target_info{job="tango"}
            name: instance
    panels:
        gc-pauses:
            kind: Panel
            spec:
                display:
                    name: GC pause duration (quantiles)
                    description: The runtime's own histogram of stop-the-world pauses. Quantiles 0.5 / 0.75 / 1 (max). The SDK publishes 0, 0.25, 0.5, 0.75 and 1 only — there is no 0.99 bucket.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_gc_duration_seconds{quantile=~"0.5|0.75|1", job="tango", instance=~"$instance"}
        gc-cycles:
            kind: Panel
            spec:
                display:
                    name: GC cycles per second
                    description: Collection frequency. A rising line with flat heap growth means allocation churn, not a memory leak.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(go_gc_duration_seconds_count{job="tango", instance=~"$instance"}[5m])
        heap:
            kind: Panel
            spec:
                display:
                    name: Heap breakdown
                    description: Allocated live heap, heap in use by the runtime, memory returned to the OS, and the total the runtime reserved. The gap in-use minus released is what the OS sees.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_alloc_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_inuse_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_released_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_sys_bytes{job="tango", instance=~"$instance"}
        alloc-rate:
            kind: Panel
            spec:
                display:
                    name: Allocation rate
                    description: Bytes allocated per second. This is the load the GC must keep up with.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(go_memstats_alloc_bytes_total{job="tango", instance=~"$instance"}[5m])
        objects:
            kind: Panel
            spec:
                display:
                    name: Live heap objects
                    description: Object count in the heap. Count rising while heap bytes stay flat means many small allocations.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_objects{job="tango", instance=~"$instance"}
        goroutines:
            kind: Panel
            spec:
                display:
                    name: Goroutines / threads / GOMAXPROCS
                    description: 'Scheduler load: runnable goroutines against the parallelism the process is given.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_goroutines{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_threads{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_sched_gomaxprocs_threads{job="tango", instance=~"$instance"}
        mem-limit:
            kind: Panel
            spec:
                display:
                    name: Memory limit and GOGC target
                    description: The soft memory limit the runtime respects and the GC target percentage. Flat lines here are configuration; movement is an operator action.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_gomemlimit_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_gc_gogc_percent{job="tango", instance=~"$instance"}
        next-gc:
            kind: Panel
            spec:
                display:
                    name: Next GC target vs heap in use
                    description: How far the heap is from forcing the next collection. A narrowing gap with a rising line is pre-GC pressure.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_next_gc_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_inuse_bytes{job="tango", instance=~"$instance"}
        fds:
            kind: Panel
            spec:
                display:
                    name: Open file descriptors vs limit
                    description: Descriptors open against the hard limit.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: process_open_fds{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: process_max_fds{job="tango", instance=~"$instance"}
        cpu:
            kind: Panel
            spec:
                display:
                    name: CPU usage
                    description: Process CPU seconds per second — 1.0 is one full core.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(process_cpu_seconds_total{job="tango", instance=~"$instance"}[5m])
        mem-total:
            kind: Panel
            spec:
                display:
                    name: Total memory (sys) by class
                    description: 'Where the reserved memory goes: heap, stacks, GC metadata, bucket/hash tables, other.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_sys_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_stack_sys_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_gc_sys_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_buck_hash_sys_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_other_sys_bytes{job="tango", instance=~"$instance"}
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/gc-pauses'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/gc-cycles'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/heap'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/alloc-rate'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/objects'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/goroutines'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/mem-limit'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/next-gc'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fds'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/cpu'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/mem-total'
