# The Postgres server, read through postgres_exporter (job="postgres-db"). The panels
# walk the questions a database answers under load: connections against the ceiling,
# whether reads are served from cache, whether transactions commit or roll back, where
# I/O time goes, and what locks and long transactions say about contention. Table-level
# panels use pg_stat_user_tables — the per-table counters the autovacuum daemon also reads.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: postgres-database
    project: tango
spec:
    display:
        name: PostgreSQL Database
    duration: 6h
    refreshInterval: 30s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: true
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - pg_up
            name: instance
    -   kind: ListVariable
        spec:
            display:
                name: Database
                hidden: false
            allowAllValue: true
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: datname
                    matchers:
                    - pg_stat_database_xact_commit{instance=~"$instance"}
            name: datname
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                    description: The postgres_exporter process is reachable and reading the server.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 1
                                color: '#dc2626'
                            -   value: 1
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: pg_up{instance=~"$instance"}
        connections:
            kind: Panel
            spec:
                display:
                    name: Connections
                    description: Backends attached per database against the server's configured ceiling. The ceiling line is a setting, not a capacity.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (pg_stat_database_numbackends{instance=~"$instance", datname=~"$datname"})
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: max(pg_settings_max_connections{instance=~"$instance"})
        conn-states:
            kind: Panel
            spec:
                display:
                    name: Connections by state
                    description: Active, idle, idle-in-transaction, and waiting backends. idle in transaction holding steady is an application leaving transactions open.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (state) (pg_stat_activity_count{instance=~"$instance", datname=~"$datname"})
        cache-hit:
            kind: Panel
            spec:
                display:
                    name: Cache hit ratio (%)
                    description: Blocks read from the buffer cache against blocks read from disk. Below ~99 on a busy database is a memory question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * sum by (datname) (rate(pg_stat_database_blks_hit{instance=~"$instance", datname=~"$datname"}[5m])) / clamp_min(sum by (datname) (rate(pg_stat_database_blks_hit{instance=~"$instance", datname=~"$datname"}[5m]) + rate(pg_stat_database_blks_read{instance=~"$instance", datname=~"$datname"}[5m])), 0.001)
        xact-rate:
            kind: Panel
            spec:
                display:
                    name: Transactions per second (commit / rollback)
                    description: Committed against rolled back. A rollback share that grows is application-level failure, not database fault.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_xact_commit{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_xact_rollback{instance=~"$instance", datname=~"$datname"}[5m]))
        deadlocks:
            kind: Panel
            spec:
                display:
                    name: Deadlocks
                    description: Deadlocks detected per second. Any nonzero steady rate is a locking-order bug in application code.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_deadlocks{instance=~"$instance", datname=~"$datname"}[5m]))
        row-activity:
            kind: Panel
            spec:
                display:
                    name: Row activity
                    description: Tuples inserted, updated, deleted, and fetched. Fetched far above returned means seq scans walking rows the query discards.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_tup_inserted{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_tup_updated{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_tup_deleted{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_tup_fetched{instance=~"$instance", datname=~"$datname"}[5m]))
        temp-io:
            kind: Panel
            spec:
                display:
                    name: Temporary I/O
                    description: Temporary files created and bytes spilled per second — work_mem could not hold the sort or hash.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_temp_files{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_temp_bytes{instance=~"$instance", datname=~"$datname"}[5m]))
        block-io:
            kind: Panel
            spec:
                display:
                    name: Block I/O time
                    description: Time backends spent reading from and writing to disk. Rising read time with a healthy cache ratio points at a noisy neighbor, not a cache miss.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_blk_read_time{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (datname) (rate(pg_stat_database_blk_write_time{instance=~"$instance", datname=~"$datname"}[5m]))
        longest-transaction:
            kind: Panel
            spec:
                display:
                    name: Longest open transaction
                    description: Max transaction duration by state. One that climbs without falling is the transaction a lock wait is stuck behind.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: max by (state) (pg_stat_activity_max_tx_duration{instance=~"$instance", datname=~"$datname"})
        locks:
            kind: Panel
            spec:
                display:
                    name: Locks held by mode
                    description: Granted locks by mode. AccessExclusive appearing here at all is worth a look, however brief.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (mode) (pg_locks_count{instance=~"$instance", datname=~"$datname"})
        db-size:
            kind: Panel
            spec:
                display:
                    name: Database size
                    description: On-disk size per database. The template databases are noise; the application database growing in steps is migration history and data.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: pg_database_size_bytes{instance=~"$instance"}
        table-io:
            kind: Panel
            spec:
                display:
                    name: Table access (seq vs index scans)
                    description: Sequential against index scans per table. A hot table served by seq scans is a missing or unused index.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (relname) (rate(pg_stat_user_tables_seq_scan{instance=~"$instance", datname=~"$datname"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (relname) (rate(pg_stat_user_tables_idx_scan{instance=~"$instance", datname=~"$datname"}[5m]))
        table-bloat:
            kind: Panel
            spec:
                display:
                    name: Dead tuples by table
                    description: Rows dead but not yet vacuumed. Tables that only climb between autovacuum passes are the bloat candidates.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (relname) (pg_stat_user_tables_n_dead_tup{instance=~"$instance", datname=~"$datname"})
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/up'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/connections'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/conn-states'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/cache-hit'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/xact-rate'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/deadlocks'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/row-activity'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/temp-io'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/block-io'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/longest-transaction'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/locks'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/db-size'
            -   x: 0
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/table-io'
            -   x: 8
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/table-bloat'
