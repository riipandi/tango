# The application's RED signal plus its resource envelope, read from the instrumentation
# the transport itself carries: otelhttp covers every API request (http_server_*), the
# otelconnect interceptor covers every procedure (rpc_server_*), and the process
# collectors cover what the process costs. The queries read the scraped side
# (job="tango", the Prometheus bridge) — the primary route, the one that keeps flowing
# while the collector is down; the OTLP push for metrics is opt-in and absent by default.
#
# The RPC histogram is `rpc_server_duration_milliseconds`: that is the name the bridge
# publishes for the otelconnect duration instrument, and the latency panels convert to
# seconds for display.
#
# The qualitative signals — what a request said (logs) and where it went (traces) —
# live in the Logs & Traces dashboard; this one stays quantitative.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: application-monitoring
    project: tango
spec:
    display:
        name: Application Monitoring
    duration: 3h
    refreshInterval: 15s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: true
            customAllValue: '.*'
            defaultValue: host.docker.internal:3080
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - target_info{job="tango"}
            name: instance
    panels:
        request-rate:
            kind: Panel
            spec:
                display:
                    name: Requests per second
                    description: API traffic by method, scraped from the Prometheus bridge — the route that keeps flowing while the collector is down.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (http_request_method) (rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[5m]))
        request-latency:
            kind: Panel
            spec:
                display:
                    name: Request latency (p50 / p90 / p99)
                    description: Duration distribution of every API request.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.90, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
        request-status:
            kind: Panel
            spec:
                display:
                    name: Responses by status
                    description: Traffic split by response class. A rising 4xx line is client behavior; a rising 5xx line is this service failing.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[5m]))
        request-errors:
            kind: Panel
            spec:
                display:
                    name: Errors per second (5xx)
                    description: 'Server-side failures. Flat zero is a reading: `or vector(0)` keeps the line drawn when the window is clean.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[5m])) or vector(0)
        rpc-rate:
            kind: Panel
            spec:
                display:
                    name: Procedure rate (by method)
                    description: ConnectRPC calls served, by procedure. The interceptor sees every procedure whatever the wire format.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (rpc_method) (rate(rpc_server_duration_milliseconds_count{job="tango", instance=~"$instance"}[5m]))
        rpc-latency:
            kind: Panel
            spec:
                display:
                    name: Procedure latency (p50 / p99)
                    description: Procedure duration, converted to seconds. `rpc_server_duration_milliseconds` is the name the bridge publishes for the otelconnect histogram.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.50, sum by (le) (rate(rpc_server_duration_milliseconds_bucket{job="tango", instance=~"$instance"}[5m]))) / 1000
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(rpc_server_duration_milliseconds_bucket{job="tango", instance=~"$instance"}[5m]))) / 1000
        rpc-response-size:
            kind: Panel
            spec:
                display:
                    name: Procedure response size (p50 / p99)
                    description: Payload size the service returns. A percentile that grows over time on one procedure is a payload question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.50, sum by (le) (rate(rpc_server_response_size_bytes_bucket{job="tango", instance=~"$instance"}[5m])))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(rpc_server_response_size_bytes_bucket{job="tango", instance=~"$instance"}[5m])))
        request-size:
            kind: Panel
            spec:
                display:
                    name: Request body size (p50 / p99)
                    description: Payload size clients send. Percentiles over the body-size histogram, not the duration one.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.50, sum by (le) (rate(http_server_request_body_size_bytes_bucket{job="tango", instance=~"$instance"}[5m])))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(http_server_request_body_size_bytes_bucket{job="tango", instance=~"$instance"}[5m])))
        cpu:
            kind: Panel
            spec:
                display:
                    name: CPU usage
                    description: Process CPU seconds per second — 1.0 means one full core.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(process_cpu_seconds_total{job="tango", instance=~"$instance"}[5m])
        memory:
            kind: Panel
            spec:
                display:
                    name: Heap memory (in use / allocated / system)
                    description: Live heap, total allocation, and the memory the runtime reserved from the OS. A gap between in-use and system that only grows is a leak signature.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_inuse_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_heap_alloc_bytes{job="tango", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_memstats_sys_bytes{job="tango", instance=~"$instance"}
        goroutines:
            kind: Panel
            spec:
                display:
                    name: Goroutines
                    description: Goroutines alive. A line that climbs without falling is a leaked goroutine or a blocked dispatcher.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: go_goroutines{job="tango", instance=~"$instance"}
        fds:
            kind: Panel
            spec:
                display:
                    name: Open file descriptors
                    description: Descriptors open against the process limit. Climbing toward the ceiling is a connection that never closes.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: process_open_fds{job="tango", instance=~"$instance"}
        uptime:
            kind: Panel
            spec:
                display:
                    name: Process uptime
                    description: Seconds since the process started. A low number after a deploy is normal; a low number without one is a crash loop.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: time() - process_start_time_seconds{job="tango", instance=~"$instance"}
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-rate'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-latency'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-status'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-errors'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/rpc-rate'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/rpc-latency'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/rpc-response-size'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-size'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/cpu'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/memory'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/goroutines'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fds'
            -   x: 0
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/uptime'
