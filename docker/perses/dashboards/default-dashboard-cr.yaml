apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
    namespace: ""
    name: default-dashboard
spec:
    display:
        name: Application Monitoring
    variables:
        - kind: ListVariable
          spec:
            display:
                name: Data Source
                description: Loki data source to query
                hidden: false
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: DatasourceVariable
                spec:
                    datasourcePluginKind: LokiDatasource
            name: DS_LOKI
        - kind: TextVariable
          spec:
            display:
                name: Filter
                hidden: false
            value: ""
            name: filter
        - kind: ListVariable
          spec:
            display:
                name: host
                hidden: false
            allowAllValue: false
            allowMultiple: false
            plugin:
                kind: PrometheusLabelNamesVariable
                spec:
                    matchers: []
            name: host
    panels:
        "0_0":
            kind: Panel
            spec:
                display:
                    name: DEBUG Logs
                    description: Number of DEBUG log messages
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        colorMode: background_solid
                        format:
                            unit: decimal
                        thresholds:
                            steps:
                                - color: '#5794f2'
                                  value: 0
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} |~ "(?i)\\b(debug)\\b" | label_format detected_level="debug" | __error__="" [$__range]))
        "0_1":
            kind: Panel
            spec:
                display:
                    name: INFO Logs
                    description: Number of INFO log messages
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        colorMode: background_solid
                        format:
                            unit: decimal
                        thresholds:
                            steps:
                                - color: '#73bf69'
                                  value: 0
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} |~ "(?i)\\b(info|notice)\\b" | label_format detected_level="info" | __error__="" [$__range]))
        "0_2":
            kind: Panel
            spec:
                display:
                    name: WARN Logs
                    description: Number of WARN log messages
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        colorMode: background_solid
                        format:
                            unit: decimal
                        thresholds:
                            steps:
                                - color: '#fade2a'
                                  value: 0
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} |~ "(?i)\\b(warn|warning)\\b" | label_format detected_level="warn" [$__range]))
        "0_3":
            kind: Panel
            spec:
                display:
                    name: ERROR Logs
                    description: Number of ERROR log messages
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        colorMode: background_solid
                        format:
                            unit: decimal
                        thresholds:
                            steps:
                                - color: '#f2495c'
                                  value: 0
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} | logfmt |~ "(?i)\\b(error|fail|critical|crit|fatal)\\b" | label_format detected_level="error" | __error__="" [$__range]))
        "0_4":
            kind: Panel
            spec:
                display:
                    name: All Logs
                    description: Total number of log messages
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        colorMode: none
                        format:
                            unit: decimal
                        sparkline: {}
                        thresholds:
                            steps:
                                - color: '#5794f2'
                                  value: 0
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum(count_over_time({hostname="$host"} [$__range]))
        "0_5":
            kind: Panel
            spec:
                display:
                    name: Warnings and errors over time
                    description: Warnings and errors over time
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: right
                            values:
                                - max
                        visual:
                            areaOpacity: 0.2
                            connectNulls: false
                            display: line
                            lineWidth: 2
                        yAxis:
                            format:
                                unit: decimal
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} |~ "\\b(?i)(warn|warning)\\b"| label_format detected_level="warn" | __error__="" [$__range]))
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: sum by (detected_level) (count_over_time({hostname="$host"} |~ "(?i)\\b(error|fail|critical|crit|fatal)\\b" | label_format detected_level="error" | __error__="" [$__range]))
        "0_6":
            kind: Panel
            spec:
                display:
                    name: Logs by severity
                    description: Display of logs by severity
                plugin:
                    kind: LogsTable
                    spec:
                        allowWrap: false
                        enableDetails: true
                        showTime: true
                queries:
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: "{hostname=\"$host\"} |~ \"(?i)\\\\b(debug)\\\\b\" | label_format detected_level=\"debug\" |= \"$filter\" | line_format `\U0001F535 {{regexReplaceAll \"level=debug|ts=[^\\\\s]+\\\\s\" __line__ \"\" | trim  }}`"
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: "{hostname=\"$host\"}|~ \"(?i)\\\\b(info|notice)\\\\b\" | label_format detected_level=\"info\" |= \"$filter\" | line_format `\U0001F7E2 {{regexReplaceAll \"level=info|ts=[^\\\\s]+\\\\s\" __line__ \"\" | trim }}`"
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: "{hostname=\"$host\"} |~ \"(?i)\\\\b(warn|warning)\\\\b\" | label_format detected_level=\"warn\" |= \"$filter\" | line_format `\U0001F7E1 {{regexReplaceAll \"level=warn|ts=[^\\\\s]+\\\\s\" __line__ \"\" | trim  }}`"
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: "{hostname=\"$host\"} \r\n|~ \"(?i)\\\\b(error|fail|critical|crit|fatal)\\\\b\" \r\n| label_format detected_level=\"error\" \r\n|= \"$filter\" \r\n| line_format `\U0001F534 {{regexReplaceAll \"level=error|ts=[^\\\\s]+\\\\s\" __line__ \"\" | trim  }}`\r\n"
                    - kind: LogQuery
                      spec:
                        plugin:
                            kind: LokiLogQuery
                            spec:
                                datasource:
                                    kind: LokiDatasource
                                query: "{hostname=\"$host\"} |= \"$filter\" | line_format `\U0001F534 {{regexReplaceAll \"level=error|ts=[^\\\\s]+\\\\s\" __line__ \"\" | trim  }}`"
    layouts:
        - kind: Grid
          spec:
            display:
                title: Overview
                collapse:
                    open: true
            items:
                - x: 0
                  "y": 1
                  width: 4
                  height: 4
                  content:
                    $ref: '#/spec/panels/0_0'
                - x: 4
                  "y": 1
                  width: 4
                  height: 4
                  content:
                    $ref: '#/spec/panels/0_1'
                - x: 8
                  "y": 1
                  width: 4
                  height: 4
                  content:
                    $ref: '#/spec/panels/0_2'
                - x: 12
                  "y": 1
                  width: 4
                  height: 4
                  content:
                    $ref: '#/spec/panels/0_3'
                - x: 16
                  "y": 1
                  width: 8
                  height: 4
                  content:
                    $ref: '#/spec/panels/0_4'
                - x: 0
                  "y": 5
                  width: 24
                  height: 8
                  content:
                    $ref: '#/spec/panels/0_5'
                - x: 0
                  "y": 13
                  width: 24
                  height: 14
                  content:
                    $ref: '#/spec/panels/0_6'
    duration: 1h

