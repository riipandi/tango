# Service-level objectives computed from the RED data the application already emits —
# no new instrumentation, only PromQL over the scraped http_server_* series. The targets
# are defaults this stack chose, not gospel: 99.9% availability (5xx are the failures a
# server owns) and 99% of requests under 300 ms, both over a 30-day window. Changing a
# target is editing the 0.999 / 0.3 constants in the queries.
#
# ConnectRPC is deliberately not covered here: the rpc_server_* series carry no status
# label (otelconnect does not export the error code in Prometheus form), so an RPC
# availability ratio cannot be computed yet. If RPC error codes land as labels, this
# dashboard grows an RPC row.
#
# The burn-rate panels are the alerting surface: multi-window burn is what vmalert
# rules page on (fast burn 1h vs 6h, slow burn 6h vs 30d). Until alerting exists, this
# dashboard is the budget's ledger.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: slo-error-budget
    project: tango
spec:
    display:
        name: SLO & Error Budget
    duration: 7d
    refreshInterval: 1m
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            defaultValue: host.docker.internal:3080
            allowAllValue: true
            customAllValue: .*
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - target_info{job="tango"}
            name: instance
    panels:
        availability:
            kind: Panel
            spec:
                display:
                    name: Availability (30d)
                    description: Share of API requests that did not fail server-side, over the 30-day SLO window. Target 99.9%.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 0
                                color: '#dc2626'
                            -   value: 99.9
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * (1 - ((sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[30d])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[30d]))))
        budget-remaining:
            kind: Panel
            spec:
                display:
                    name: Error budget remaining (availability, %)
                    description: Of the 0.1% the 99.9% target allows over 30 days. Negative means the budget is exhausted and every further 5xx is borrowing against the future.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 0
                                color: '#dc2626'
                            -   value: 25
                                color: '#d97706'
                            -   value: 50
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * (1 - ((sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[30d])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[30d]))) / 0.001)
        latency-slo:
            kind: Panel
            spec:
                display:
                    name: Latency SLO compliance (30d)
                    description: 'Share of API requests answered in under 300 ms. Target: 99%.'
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 0
                                color: '#dc2626'
                            -   value: 99
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * sum(rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance", le="0.3"}[30d])) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[30d]))
        latency-budget-remaining:
            kind: Panel
            spec:
                display:
                    name: Error budget remaining (latency, %)
                    description: Of the 1% the 99%-under-300ms target allows over 30 days.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 0
                                color: '#dc2626'
                            -   value: 25
                                color: '#d97706'
                            -   value: 50
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * ((sum(rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance", le="0.3"}[30d])) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[30d]))) - 0.99) / 0.01
        burn-1h:
            kind: Panel
            spec:
                display:
                    name: Burn rate, 1-hour window
                    description: How fast the availability budget burns relative to its steady pace. 1.0 is exactly on budget; 14.4 exhausts it in two days. Above 1 while below budget is fine; above 1 while near zero is an incident.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: (sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[1h])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[1h])) / 0.001
        burn-6h:
            kind: Panel
            spec:
                display:
                    name: Burn rate, 6-hour window
                    description: 'The same rate over the 6-hour window: smooths spikes, catches slow burns the 1-hour line rides out.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: (sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[6h])) or vector(0)) / sum(rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[6h])) / 0.001
        status-split:
            kind: Panel
            spec:
                display:
                    name: 5xx by status code
                    description: Which failure the budget is being spent on. 502/504 means an upstream question; 500 means this service's own.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance", http_response_status_code=~"5.."}[1h]))
        p99:
            kind: Panel
            spec:
                display:
                    name: Request latency p99
                    description: The tail the latency SLO polices, against the 300 ms target.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[1h])))
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/availability'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/budget-remaining'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/latency-slo'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/latency-budget-remaining'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/burn-1h'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/burn-6h'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/status-split'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/p99'
