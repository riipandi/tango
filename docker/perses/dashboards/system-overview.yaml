# One pane across every component this stack runs: the application, its edge, its
# stores, and the telemetry pipeline itself. Each stat answers "is it up"; the charts
# answer "is it healthy while up". Deep dives live in the per-component dashboards —
# this one is the map, not the territory.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: system-overview
    project: tango
spec:
    display:
        name: System Overview
    duration: 3h
    refreshInterval: 15s
    panels:
        tango:
            kind: Panel
            spec:
                display:
                    name: Application
                    description: Scrape health of the Go process. Down while `serve` is not running is expected in this stack.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: &id001
                            -   value: 1
                                color: '#dc2626'
                            -   value: 1
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="tango"}
        postgres:
            kind: Panel
            spec:
                display:
                    name: PostgreSQL
                    description: up{job="postgres-db"}
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: *id001
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="postgres-db"}
        valkey:
            kind: Panel
            spec:
                display:
                    name: Valkey
                    description: up{job="redis-db"}
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: *id001
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="redis-db"}
        edge:
            kind: Panel
            spec:
                display:
                    name: Nginx Edge
                    description: up{job="nginx"}
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: *id001
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="nginx"}
        vector:
            kind: Panel
            spec:
                display:
                    name: Vector
                    description: 'The collector carrying logs and traces. Down does not stop metrics: they leave by the scraped pull route.'
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: *id001
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="vector"}
        selfmonitor:
            kind: Panel
            spec:
                display:
                    name: VictoriaMetrics
                    description: The metrics store scraping itself.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps: *id001
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: up{job="victoria-metrics"}
        traffic:
            kind: Panel
            spec:
                display:
                    name: 'Traffic: edge vs application'
                    description: Requests per second seen by the proxy and answered by the application. A widening gap is traffic the proxy answers without reaching a handler.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: label_replace(sum(rate(nginx_http_requests_total{job="nginx"}[5m])), "layer", "edge", "", "")
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: label_replace(sum(rate(http_server_request_duration_seconds_count{job="tango"}[5m])), "layer", "application", "", "")
        errors:
            kind: Panel
            spec:
                display:
                    name: Application errors (5xx)
                    description: Server-side failures per second. `or vector(0)` keeps the line on zero when the window is clean, so a flat zero is a reading, not an absence.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(http_server_request_duration_seconds_count{job="tango", http_response_status_code=~"5.."}[5m])) or vector(0)
        latency:
            kind: Panel
            spec:
                display:
                    name: Application latency (p99)
                    description: Slowest one percent of API requests, across all instances.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango"}[5m])))
        postgres-cache:
            kind: Panel
            spec:
                display:
                    name: PostgreSQL cache hit ratio (%)
                    description: Blocks read from the buffer cache against blocks read from disk. Below ~99 on a busy database is a memory question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * sum(pg_stat_database_blks_hit{job="postgres-db", datname!~"template.*"}) / clamp_min(sum(pg_stat_database_blks_hit{job="postgres-db", datname!~"template.*"} + pg_stat_database_blks_read{job="postgres-db", datname!~"template.*"}), 1)
        valkey-hit:
            kind: Panel
            spec:
                display:
                    name: Valkey cache hit ratio (%)
                    description: Reads served from memory against reads that missed. A falling line on a growing key space is the eviction question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * sum(rate(redis_keyspace_hits_total{job="redis-db"}[5m])) / clamp_min(sum(rate(redis_keyspace_hits_total{job="redis-db"}[5m])) + sum(rate(redis_keyspace_misses_total{job="redis-db"}[5m])), 0.001)
        logs:
            kind: Panel
            spec:
                display:
                    name: Application logs per second
                    description: Log volume by severity, read from the log store (VictoriaLogs) the Vector pipeline writes into.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: VictoriaLogsTimeSeriesQuery
                            spec:
                                query: '{service.name="tango"} | stats by (severity_text) count(*)'
        pipeline:
            kind: Panel
            spec:
                display:
                    name: Telemetry pipeline throughput
                    description: Events per second each Vector sink delivers. A sink that drops to zero while its source keeps receiving is backpressure.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (component_id) (rate(vector_component_sent_events_total{component_kind="sink"}[5m]))
        ingest:
            kind: Panel
            spec:
                display:
                    name: Metrics ingestion rate
                    description: Rows VictoriaMetrics ingests per second, across every scrape job and push leg.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(vm_rows_inserted_total[5m]))
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/tango'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/postgres'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/valkey'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/edge'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vector'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/selfmonitor'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/traffic'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/errors'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/latency'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/postgres-cache'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/valkey-hit'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/logs'
            -   x: 0
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/pipeline'
            -   x: 8
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/ingest'
