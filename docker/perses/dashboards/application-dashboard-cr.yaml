# The application's RED signal, read from the instrumentation the transport
# itself carries: otelhttp covers every API request (the http_server_* series)
# and the otelconnect interceptor covers every procedure (the rpc_server_*
# histograms). The queries read the scraped side (job="tango", the Prometheus
# bridge) — the primary route, the one that keeps flowing while the collector
# is down; the OTLP push for metrics is opt-in and absent by default.
apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: application-monitoring
    project: tango
spec:
    display:
        name: Application Monitoring
    duration: 3h
    refreshInterval: 15s
    variables:
        - kind: ListVariable
          spec:
              display:
                  name: Instance
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: instance
                      matchers:
                          - target_info{job="tango"}
              name: instance
    panels:
        request-rate:
            kind: Panel
            spec:
                display:
                    name: Requests per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (http_request_method) (rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[5m]))'
        request-latency:
            kind: Panel
            spec:
                display:
                    name: Request latency (p50 / p99)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))'
        request-status:
            kind: Panel
            spec:
                display:
                    name: Responses by status
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (http_response_status_code) (rate(http_server_request_duration_seconds_count{job="tango", instance=~"$instance"}[5m]))'
        request-errors:
            kind: Panel
            spec:
                display:
                    name: Errors per second (5xx)
                    description: Server-side failures. `or vector(0)` keeps the line on zero when the window is clean, so a flat zero is a reading, not an absence.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                            lineWidth: 2
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum(rate(http_server_request_duration_seconds_count{job="tango", http_response_status_code=~"5..", instance=~"$instance"}[5m])) or vector(0)'
        rpc-latency:
            kind: Panel
            spec:
                display:
                    name: Procedure latency (p99, by method)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: milliseconds
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'histogram_quantile(0.99, sum by (le, rpc_method) (rate(rpc_server_duration_milliseconds_bucket{job="tango", instance=~"$instance"}[5m])))'
        rpc-rate:
            kind: Panel
            spec:
                display:
                    name: Procedures per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (rpc_method) (rate(rpc_server_duration_milliseconds_count{job="tango", instance=~"$instance"}[5m]))'
        rpc-request-size:
            kind: Panel
            spec:
                display:
                    name: Procedure request size (p99)
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        yAxis:
                            format:
                                unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'histogram_quantile(0.99, sum by (le) (rate(rpc_server_request_size_bytes_bucket{job="tango", instance=~"$instance"}[5m])))'
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/request-rate'
                  - x: 8
                    y: 0
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/request-latency'
                  - x: 16
                    y: 0
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/request-status'
                  - x: 0
                    y: 8
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/request-errors'
                  - x: 8
                    y: 8
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/rpc-latency'
                  - x: 16
                    y: 8
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/rpc-rate'
                  - x: 0
                    y: 16
                    width: 24
                    height: 8
                    content:
                        $ref: '#/spec/panels/rpc-request-size'
