# The engine room: the subsystems the application runs on its own behalf — the
# durable task queue, the cron scheduler above it, the storage engine, the
# outbound HTTP client, and the rate limiter. Each is instrumented with the
# counters its own contract implies: the queue by outcome (retry, dead,
# unknown queue), the scheduler by claim result, storage by sync outcome and
# bytes, the fetcher by the same error classes its callers match, and the
# limiter by surface and outcome — where "degraded" is the pass-through a
# failed limiter is allowed and must never do silently.
#
# The instruments come from the OTel SDK through the same Prometheus bridge as
# the transport's own series, so they are read here the same way: scraped from
# job="tango". They exist only while the process that owns the subsystem runs.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: application-internals
    project: tango
spec:
    display:
        name: Application Internals
    duration: 3h
    refreshInterval: 15s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            defaultValue: host.docker.internal:3080
            allowAllValue: true
            customAllValue: .*
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - target_info{job="tango"}
            name: instance
    panels:
        queue-outcomes:
            kind: Panel
            spec:
                display:
                    name: Queue tasks by outcome
                    description: Tasks the dispatcher settled, by queue and outcome. `retry` climbing with `dead` close behind is a job failing its way through its attempt budget; `unknown_queue` means a task arrived for a queue this process never registered.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (queue, outcome) (rate(tango_queue_tasks_processed_total{job="tango", instance=~"$instance"}[5m]))
        queue-rate:
            kind: Panel
            spec:
                display:
                    name: Tasks enqueued vs processed
                    description: Intake against throughput. A line where enqueue outruns processing for long is a backlog forming; the two should trace each other over time.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_queue_tasks_enqueued_total{job="tango", instance=~"$instance"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_queue_tasks_processed_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        queue-duration:
            kind: Panel
            spec:
                display:
                    name: Task duration (p50 / p99)
                    description: How long one task runs. p99 growing while p50 holds is one job type degrading; both growing is the worker pool starved or the database slow.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.50, sum by (le) (rate(tango_queue_task_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(tango_queue_task_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
        queue-attempts:
            kind: Panel
            spec:
                display:
                    name: Attempts per task (avg)
                    description: How many tries a settled task consumed. An average above 1 that stays there is a job failing transiently on every run — a backoff loop the retry budget is absorbing.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_queue_task_attempts_count{job="tango", instance=~"$instance"}[5m]) * 0) or vector(0)
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_queue_task_attempts_sum{job="tango", instance=~"$instance"}[5m])) / clamp_min(sum(rate(tango_queue_task_attempts_count{job="tango", instance=~"$instance"}[5m])), 0.001)
        queue-claims:
            kind: Panel
            spec:
                display:
                    name: Failed claims
                    description: Rounds where the dispatcher could not read the pending table. Any steady rate is a database question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 1
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(tango_queue_claims_failed_total{job="tango", instance=~"$instance"}[5m]) or vector(0)
        scheduler-ticks:
            kind: Panel
            spec:
                display:
                    name: Scheduler ticks by outcome
                    description: 'Fires per job: `claimed` here, `skipped` because another replica won the row — the claim design working, not a miss — and `error` when the claim transaction failed.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 1
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (job, outcome) (rate(tango_scheduler_ticks_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        scheduler-duration:
            kind: Panel
            spec:
                display:
                    name: Tick duration (p99)
                    description: Time one fire spent claiming and enqueueing. Growing p99 is the scheduler competing for database locks it should hold briefly.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le, job) (rate(tango_scheduler_tick_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
        scheduler-reseeds:
            kind: Panel
            spec:
                display:
                    name: State rows re-seeded
                    description: Rebuilt schedule rows — a manual delete or a restored dump. Zero is the reading; any nonzero is an operator event.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 1
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(tango_scheduler_reseeds_total{job="tango", instance=~"$instance"}[5m]) or vector(0)
        storage-uploads:
            kind: Panel
            spec:
                display:
                    name: Storage sync rounds by outcome
                    description: 'Upload rounds: `success`, `skipped` — the retry that arrived after another attempt finished, the idempotence contract working — and `error`.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (outcome) (rate(tango_storage_uploads_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        storage-bytes:
            kind: Panel
            spec:
                display:
                    name: Bytes uploaded per second
                    description: Staging bytes that reached the backend. This is the actual egress the upload budget and the connection share.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_storage_bytes_uploaded_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        storage-throughput:
            kind: Panel
            spec:
                display:
                    name: Files staged / settled / chunks uploaded
                    description: 'The staging pipeline at a glance: files written in, files whose upload was enqueued, and chunks the backend did not hold yet.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_storage_files_staged_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_storage_staging_settled_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_storage_chunks_uploaded_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        fetch-outcomes:
            kind: Panel
            spec:
                display:
                    name: Outbound calls by outcome
                    description: Every call through the shared HTTP client, by outcome class — the same taxonomy the caller matches with errors.Is. `circuit_open` above zero means a host tripped its breaker and calls are being refused without travel.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (outcome) (rate(tango_fetch_requests_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
        fetch-duration:
            kind: Panel
            spec:
                display:
                    name: Outbound call duration (p99)
                    description: Per host, retries included. One host's p99 climbing while others hold is that host degrading — the signal that precedes its breaker opening.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le, host) (rate(tango_fetch_request_duration_seconds_bucket{job="tango", instance=~"$instance"}[5m])))
        fetch-attempts:
            kind: Panel
            spec:
                display:
                    name: Attempts per outbound call (avg)
                    description: How hard the retry budget works per call. Rising with flat outcomes is a host answering slowly enough to trip retries but not the breaker.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(tango_fetch_request_attempts_sum{job="tango", instance=~"$instance"}[5m])) / clamp_min(sum(rate(tango_fetch_request_attempts_count{job="tango", instance=~"$instance"}[5m])), 0.001) or vector(0)
        fetch-breaker:
            kind: Panel
            spec:
                display:
                    name: Circuit breaker opens
                    description: Times a host's breaker tripped. Flat zero is the reading; the count is small by nature — each entry is a real upstream failure episode.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 1
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(tango_fetch_breaker_opens_total{job="tango", instance=~"$instance"}[5m]) or vector(0)
        ratelimit-outcomes:
            kind: Panel
            spec:
                display:
                    name: Rate limit checks by surface and outcome
                    description: REST against RPC. `limited` is the limiter doing its job; a rising `degraded` means the limiter could not answer and requests passed unchecked — the protection has failed open.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (surface, outcome) (rate(tango_http_ratelimit_requests_total{job="tango", instance=~"$instance"}[5m])) or vector(0)
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/queue-outcomes'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/queue-rate'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/queue-duration'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/queue-attempts'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/queue-claims'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/scheduler-ticks'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/scheduler-duration'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/scheduler-reseeds'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/storage-uploads'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/storage-bytes'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/storage-throughput'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fetch-outcomes'
            -   x: 0
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fetch-duration'
            -   x: 8
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fetch-attempts'
            -   x: 16
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fetch-breaker'
            -   x: 0
                y: 40
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/ratelimit-outcomes'
