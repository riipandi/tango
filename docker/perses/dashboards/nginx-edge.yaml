# The edge proxy, read from the stub_status endpoint Vector's nginx_metrics source polls
# and re-publishes at :9599 (job="nginx"), plus the edge's own access logs: nginx writes
# one JSON line per request, Vector ships it to the log store as service.name="nginx",
# and the three VictoriaLogs panels at the end read it back with LogsQL. stub_status is
# aggregate on purpose — no status-code split — which is exactly the gap the access-log
# panels close: a 502 the proxy answers itself never reaches a handler that could count
# it, but it does appear in the log.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: nginx-edge
    project: tango
spec:
    display:
        name: Nginx Edge
    duration: 3h
    refreshInterval: 15s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: true
            customAllValue: .*
            defaultValue: nginx-proxy-01
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - nginx_up
            name: instance
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                    description: 1 means the exporter reached nginx's stub_status endpoint.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 1
                                color: '#dc2626'
                            -   value: 1
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_up{job="nginx", instance=~"$instance"}
        active-connections:
            kind: Panel
            spec:
                display:
                    name: Active connections
                    description: Open connections right now. A line that ratchets up and stays there is a slow client or a stuck upstream.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_connections_active{job="nginx", instance=~"$instance"}
        connection-states:
            kind: Panel
            spec:
                display:
                    name: Connections by state
                    description: Reading / writing / waiting. Growing waiting at steady traffic is keep-alive doing its job; growing reading is slow clients.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_connections_reading{job="nginx", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_connections_writing{job="nginx", instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: nginx_connections_waiting{job="nginx", instance=~"$instance"}
        request-rate:
            kind: Panel
            spec:
                display:
                    name: Requests per second
                    description: Aggregate request rate nginx reports. stub_status counts connections served since start, so the rate is the truth.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(nginx_http_requests_total{job="nginx", instance=~"$instance"}[5m])
        accepted-vs-handled:
            kind: Panel
            spec:
                display:
                    name: Accepted vs handled connections
                    description: Acceptance against completion. A handled line that lags accepted is a backlog the accept queue is holding.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(nginx_connections_accepted{job="nginx", instance=~"$instance"}[5m])
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(nginx_connections_handled{job="nginx", instance=~"$instance"}[5m])
        req-per-conn:
            kind: Panel
            spec:
                display:
                    name: Requests per connection
                    description: 'How many requests one accepted connection carries on average. A ratio near 1 means connections churn: no keep-alive upstream of the proxy.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(nginx_http_requests_total{job="nginx", instance=~"$instance"}[5m]) / clamp_min(rate(nginx_connections_accepted{job="nginx", instance=~"$instance"}[5m]), 0.001)
        edge-vs-app:
            kind: Panel
            spec:
                display:
                    name: Edge vs application requests
                    description: The proxy's request rate against the application's own (scraped from the Prometheus bridge). The gap is what the proxy answers itself — redirects, static files, rejected traffic.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: rate(nginx_http_requests_total{job="nginx", instance=~"$instance"}[5m])
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(http_server_request_duration_seconds_count{job="tango"}[5m]))
        edge-status:
            kind: Panel
            spec:
                display:
                    name: Response by status (edge)
                    description: 'Access-log truth: every response the proxy answered, by status code. This is where proxy-generated 502/504 appear that stub_status cannot see.'
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 1
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: VictoriaLogsTimeSeriesQuery
                            spec:
                                query: '{service.name="nginx"} | stats by (status) count(*)'
        edge-5xx:
            kind: Panel
            spec:
                display:
                    name: 5xx per second (edge)
                    description: Server-side failures at the edge, from the access log. Flat zero is a reading, not an absence — until the log pipeline is down, which the pipeline dashboard says.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: VictoriaLogsTimeSeriesQuery
                            spec:
                                query: '{service.name="nginx", status=~"5.."} | stats count(*)'
        edge-latency:
            kind: Panel
            spec:
                display:
                    name: Request time at the edge (p50 / p95)
                    description: Total time the proxy spent per request, from the access log. Rising p50 with flat application latency is proxy or network; rising together is upstream.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: VictoriaLogsTimeSeriesQuery
                            spec:
                                query: '{service.name="nginx"} | stats quantile(0.95, request_time)'
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: VictoriaLogsTimeSeriesQuery
                            spec:
                                query: '{service.name="nginx"} | stats quantile(0.50, request_time)'
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/up'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/active-connections'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/connection-states'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/request-rate'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/accepted-vs-handled'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/req-per-conn'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/edge-vs-app'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/edge-status'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/edge-5xx'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/edge-latency'
