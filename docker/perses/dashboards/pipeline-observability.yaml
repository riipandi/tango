# The telemetry pipeline itself: Vector, the one collector carrying logs and traces, and
# VictoriaMetrics, the store every signal's metrics land in. The panels watch the
# watchers — throughput per component, buffer occupancy against the drop threshold, send
# latency, the store's own ingestion and scrape health, and the disk and memory the store
# runs against. Metrics are read here by the pull route, so this dashboard keeps working
# when Vector itself is down; the Vector panels go quiet and the up/down stat says why.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: pipeline-observability
    project: tango
spec:
    display:
        name: Telemetry Pipeline
    duration: 6h
    refreshInterval: 30s
    panels:
        uptime:
            kind: Panel
            spec:
                display:
                    name: Vector uptime
                    description: Seconds since the collector started. A reset without an operator action is the nightly build misbehaving.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: vector_uptime_seconds{job="vector"}
        throughput:
            kind: Panel
            spec:
                display:
                    name: Sink throughput
                    description: Events per second each sink delivers. A sink that drops to zero while its source keeps receiving is backpressure.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (component_id) (rate(vector_component_sent_events_total{component_kind="sink"}[5m]))
        intake:
            kind: Panel
            spec:
                display:
                    name: Source intake
                    description: Events per second each source accepts. Sources keep receiving while sinks stall — that is what the buffers are for.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (component_id) (rate(vector_component_received_events_total{component_kind="source"}[5m]))
        buffer-occupancy:
            kind: Panel
            spec:
                display:
                    name: Buffer occupancy
                    description: Buffer size against its configured maximum. A line approaching 1 is the moment events start being dropped.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: max by (component_id) (vector_buffer_size_events / vector_buffer_max_size_events)
        buffer-flow:
            kind: Panel
            spec:
                display:
                    name: Buffer in / out
                    description: Events entering and leaving buffers. Sustained inflow above outflow means the sink cannot keep up with the source.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (buffer_id) (rate(vector_buffer_received_events_total[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (buffer_id) (rate(vector_buffer_sent_events_total[5m]))
        send-latency:
            kind: Panel
            spec:
                display:
                    name: Sink send duration (p99)
                    description: How long a batch takes to deliver. Rising send duration at flat volume is the remote endpoint slowing down.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: seconds
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le, buffer_id) (rate(vector_buffer_send_duration_seconds_bucket[5m])))
        vm-ingest:
            kind: Panel
            spec:
                display:
                    name: VictoriaMetrics ingestion
                    description: Rows inserted per second and rows rejected as invalid. Invalid above zero is a series the store refuses — usually a label scheme problem.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(vm_rows_inserted_total[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(vm_rows_invalid_total[5m])) or vector(0)
        vm-series:
            kind: Panel
            spec:
                display:
                    name: Stored series (rows)
                    description: Total rows held in the store. A line that climbs much faster than retention removes is cardinality growth.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(vm_rows)
        scrape-health:
            kind: Panel
            spec:
                display:
                    name: Scrape duration by job
                    description: How long each scrape takes. Approaching the scrape interval means the endpoint is at its limit.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: max by (job) (scrape_duration_seconds)
        down-targets:
            kind: Panel
            spec:
                display:
                    name: Down targets
                    description: Targets any job reports down. Flat zero is a reading; the moment it moves, `task metrics:targets` says which one.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: count(up == 0) or vector(0)
        vm-disk:
            kind: Panel
            spec:
                display:
                    name: VictoriaMetrics free disk space
                    description: Bytes free where the store writes, against the low-water mark it refuses writes below. Approaching the limit is the retention question asking to be answered.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: vm_free_disk_space_bytes{job="victoria-metrics"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: vm_free_disk_space_limit_bytes{job="victoria-metrics"}
        vm-read-only:
            kind: Panel
            spec:
                display:
                    name: Storage read-only
                    description: 1 means the store stopped accepting writes (disk below its limit). Anything but 0 is an outage for every dashboard behind it.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 1
                                color: '#dc2626'
                            -   value: 1
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: max(vm_storage_is_read_only{job="victoria-metrics"})
        vm-memory:
            kind: Panel
            spec:
                display:
                    name: VictoriaMetrics memory (available vs allowed)
                    description: Memory the process can get from the OS against the cap it self-limits to. Available falling toward allowed is the OOM-kill path forming.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: vm_available_memory_bytes{job="victoria-metrics"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: vm_allowed_memory_bytes{job="victoria-metrics"}
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/uptime'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/throughput'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/intake'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/buffer-occupancy'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/buffer-flow'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/send-latency'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vm-ingest'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vm-series'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/scrape-health'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/down-targets'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vm-disk'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vm-read-only'
            -   x: 0
                y: 32
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/vm-memory'
