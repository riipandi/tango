# The valkey server, read through redis_exporter (job="redis-db", target valkey:6379).
# The panels walk the questions a cache answers: is the hit ratio healthy, is memory
# approaching its ceiling or fragmenting, are keys surviving or being evicted, and is
# persistence keeping up with writes.
#
# Native provisioning format: kind Dashboard with a project.

apiVersion: perses.dev/v1alpha1
kind: Dashboard
metadata:
    name: valkey-cache
    project: tango
spec:
    display:
        name: Valkey Cache
    duration: 6h
    refreshInterval: 30s
    variables:
    -   kind: ListVariable
        spec:
            display:
                name: Instance
                hidden: false
            allowAllValue: true
            customAllValue: '.*'
            defaultValue: redis-server-01
            allowMultiple: false
            plugin:
                kind: PrometheusLabelValuesVariable
                spec:
                    labelName: instance
                    matchers:
                    - target_info{job="redis-db"}
            name: instance
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                    description: The redis_exporter process is reachable and reading the server.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                            -   value: 1
                                color: '#dc2626'
                            -   value: 1
                                color: '#16a34a'
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_up{instance=~"$instance"}
        hit-ratio:
            kind: Panel
            spec:
                display:
                    name: Cache hit ratio (%)
                    description: Reads served from memory against misses. A falling line on a growing key space is the eviction question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: 100 * sum(rate(redis_keyspace_hits_total{job="redis-db", instance=~"$instance"}[5m])) / clamp_min(sum(rate(redis_keyspace_hits_total{job="redis-db", instance=~"$instance"}[5m])) + sum(rate(redis_keyspace_misses_total{job="redis-db", instance=~"$instance"}[5m])), 0.001)
        memory:
            kind: Panel
            spec:
                display:
                    name: Memory used vs peak vs max
                    description: Current allocation, the high-water mark, and the configured ceiling (0 means unlimited — the line simply sits at zero).
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                        yAxis:
                            format:
                                unit: bytes
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_memory_used_bytes{instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_memory_used_peak_bytes{instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_memory_max_bytes{instance=~"$instance"}
        fragmentation:
            kind: Panel
            spec:
                display:
                    name: Memory fragmentation ratio
                    description: RSS against allocated bytes. Above ~1.5 the allocator has fragmented; below 1 the swap question starts.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_mem_fragmentation_ratio{instance=~"$instance"}
        evictions:
            kind: Panel
            spec:
                display:
                    name: Evicted / expired keys per second
                    description: Keys removed under memory pressure against keys expiring naturally. Evictions above zero with a hit ratio in decline is the memory answer arriving.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(redis_evicted_keys_total{instance=~"$instance"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(redis_expired_keys_total{instance=~"$instance"}[5m]))
        keys:
            kind: Panel
            spec:
                display:
                    name: Keys per database
                    description: Key count and the subset with a TTL. Keys without expiry that only grow are the leak candidates.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (db) (redis_db_keys{instance=~"$instance"})
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum by (db) (redis_db_keys_expiring{instance=~"$instance"})
        clients:
            kind: Panel
            spec:
                display:
                    name: Clients
                    description: Connected and blocked clients. Blocked rising at steady traffic is a command waiting on something that is not the network.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_connected_clients{instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_blocked_clients{instance=~"$instance"}
        commands:
            kind: Panel
            spec:
                display:
                    name: Commands per second
                    description: Throughput of the whole command loop.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(redis_commands_processed_total{instance=~"$instance"}[5m]))
        command-errors:
            kind: Panel
            spec:
                display:
                    name: Failed / rejected calls per second
                    description: Commands that errored against commands rejected by limits. Rejections are protective; failures are application bugs asking loudly.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(redis_commands_failed_calls_total{instance=~"$instance"}[5m]))
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: sum(rate(redis_commands_rejected_calls_total{instance=~"$instance"}[5m]))
        persistence:
            kind: Panel
            spec:
                display:
                    name: Persistence state
                    description: RDB save in progress, changes since the last save, and AOF buffer length. Changes climbing while no save runs is the durability window widening.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_rdb_bgsave_in_progress{instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_rdb_changes_since_last_save{instance=~"$instance"}
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_aof_buffer_length{instance=~"$instance"}
        latency:
            kind: Panel
            spec:
                display:
                    name: Command latency (p99, µs)
                    description: The server's own latency histogram for command execution, in microseconds.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            areaOpacity: 0.2
                            lineWidth: 2
                        legend:
                            mode: table
                            position: bottom
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: histogram_quantile(0.99, sum by (le) (rate(redis_commands_latencies_usec_bucket{job="redis-db", instance=~"$instance"}[5m])))
        uptime:
            kind: Panel
            spec:
                display:
                    name: Server uptime
                    description: Seconds since the server started. A reset here without an operator action is a crash or an OOM kill.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                -   kind: TimeSeriesQuery
                    spec:
                        plugin:
                            kind: PrometheusTimeSeriesQuery
                            spec:
                                query: redis_uptime_in_seconds{job="redis-db", instance=~"$instance"}
    layouts:
    -   kind: Grid
        spec:
            items:
            -   x: 0
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/up'
            -   x: 8
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/hit-ratio'
            -   x: 16
                y: 0
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/memory'
            -   x: 0
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/fragmentation'
            -   x: 8
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/evictions'
            -   x: 16
                y: 8
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/keys'
            -   x: 0
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/clients'
            -   x: 8
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/commands'
            -   x: 16
                y: 16
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/command-errors'
            -   x: 0
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/persistence'
            -   x: 8
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/latency'
            -   x: 16
                y: 24
                width: 8
                height: 8
                content:
                    $ref: '#/spec/panels/uptime'
