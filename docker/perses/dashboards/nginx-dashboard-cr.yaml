# The edge proxy, read from nginx-exporter over the stub_status endpoint the
# 9180 server publishes. stub_status is aggregate on purpose: connections and a
# request counter, no status-code split — a 502 the proxy answers itself never
# reaches a handler that could count it. The panels here answer the questions
# stub_status can: is the proxy up, is it saturated, and is request traffic
# flowing — the split between the layers comes from comparing this request rate
# against the application's own.
#
# Native provisioning format: kind Dashboard with a project.
kind: Dashboard
metadata:
    name: nginx-edge
    project: tango
spec:
    display:
        name: Nginx Edge
    duration: 3h
    refreshInterval: 30s
    variables:
        - kind: ListVariable
          spec:
              display:
                  name: Instance
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: instance
                      matchers:
                          - nginx_up
              name: instance
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                        thresholds:
                            mode: absolute
                            steps:
                                - value: 1
                                  color: '#dc2626'
                                - value: 1
                                  color: '#16a34a'
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'nginx_up{instance=~"$instance"}'
        active-connections:
            kind: Panel
            spec:
                display:
                    name: Active connections
                    description: Open connections right now. A line that ratchets up and stays there is a slow client or a stuck upstream.
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'nginx_connections_active{instance=~"$instance"}'
        request-rate:
            kind: Panel
            spec:
                display:
                    name: Requests per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(nginx_http_requests_total{instance=~"$instance"}[5m])'
        connection-states:
            kind: Panel
            spec:
                display:
                    name: Connections by state
                    description: Reading (receiving the request), writing (answering it), waiting (keep-alive idle). Waiting dominating is healthy; reading piling up is a slowloris or a slow client body.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'nginx_connections_reading{instance=~"$instance"}'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'nginx_connections_writing{instance=~"$instance"}'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'nginx_connections_waiting{instance=~"$instance"}'
        accepted-vs-handled:
            kind: Panel
            spec:
                display:
                    name: Accepted vs handled
                    description: The two counters move together in a healthy worker; a gap that opens is a connection the worker accepted but never processed (typically a worker crash or a listen backlog overflow).
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(nginx_connections_accepted_total{instance=~"$instance"}[5m])'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(nginx_connections_handled_total{instance=~"$instance"}[5m])'
        edge-vs-app:
            kind: Panel
            spec:
                display:
                    name: Edge vs application requests
                    description: nginx's request rate against the application's own. The gap is what the edge absorbed — its own 4xx and 5xx, health probes, or traffic that never became a handler call.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(nginx_http_requests_total{instance=~"$instance"}[5m])'
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum(rate(http_server_request_duration_seconds_count{service_name="tango"}[5m]))'
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/up'
                  - x: 6
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/active-connections'
                  - x: 15
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/request-rate'
                  - x: 0
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/connection-states'
                  - x: 8
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/accepted-vs-handled'
                  - x: 16
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/edge-vs-app'
