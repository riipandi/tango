# The application's qualitative signals in one place: what a request said
# (logs, read back from VictoriaLogs over LogsQL) and where it went (traces,
# read back from VictoriaTraces through its Jaeger query API). Application
# Monitoring stays quantitative; this dashboard is the drill-down pair.
#
# The log stream is what the logger's OTLP sink ships: service_name is the
# resource attribute the observer sets, severity_text is the level the SDK
# carries from slog. The time-series panels read the hit counts the LogsQL
# filter returns; the tables show the log lines and the traces themselves.
# Both signals are keyed by the same service name, which is why they share a
# variable.
#
# Native provisioning format: kind Dashboard with a project, because a
# dashboard is project-scoped in Perses.
kind: Dashboard
metadata:
    name: logs-traces
    project: tango
spec:
    display:
        name: Logs & Traces
    duration: 1h
    refreshInterval: 30s
    variables:
        - kind: TextVariable
          spec:
              display:
                  name: Service
                  description: The service name the observer sets (otel.service_name); the logs and the traces both key on it.
              value: tango
              name: service
        - kind: TextVariable
          spec:
              display:
                  name: Filter
                  description: A LogsQL filter pipe appended to every log query (e.g. `| body=~"(?i)timeout"`)
              value: ""
              name: filter
    panels:
        logs-by-severity:
            kind: Panel
            spec:
                display:
                    name: Logs by severity
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        legend:
                            mode: table
                            position: bottom
                        visual:
                            display: line
                            lineWidth: 1
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: VictoriaLogsTimeSeriesQuery
                              spec:
                                  query: '{service.name="$service"} | stats by (severity_text) count(*)'
        error-rate:
            kind: Panel
            spec:
                display:
                    name: Errors per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                            lineWidth: 2
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: VictoriaLogsTimeSeriesQuery
                              spec:
                                  query: '{service.name="$service", severity_text=~"error|fatal"} | stats count(*)'
        all-logs:
            kind: Panel
            spec:
                display:
                    name: Logs per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: VictoriaLogsTimeSeriesQuery
                              spec:
                                  query: '{service.name="$service"} | stats count(*)'
        log-lines:
            kind: Panel
            spec:
                display:
                    name: Log lines
                plugin:
                    kind: LogsTable
                    spec:
                        showTime: true
                queries:
                    - kind: LogQuery
                      spec:
                          plugin:
                              kind: VictoriaLogsLogQuery
                              spec:
                                  query: '{service.name="$service"} $filter'
        traces:
            kind: Panel
            spec:
                display:
                    name: Traces
                    description: The most recent traces the service recorded. Click one to open its spans. A slow or failed span found here explains what the latency and error panels in Application Monitoring counted.
                plugin:
                    kind: TraceTable
                    spec: {}
                queries:
                    - kind: TraceQuery
                      spec:
                          plugin:
                              kind: JaegerTraceQuery
                              spec:
                                  service: $service
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 12
                    height: 8
                    content:
                        $ref: '#/spec/panels/logs-by-severity'
                  - x: 12
                    y: 0
                    width: 6
                    height: 8
                    content:
                        $ref: '#/spec/panels/error-rate'
                  - x: 18
                    y: 0
                    width: 6
                    height: 8
                    content:
                        $ref: '#/spec/panels/all-logs'
                  - x: 0
                    y: 8
                    width: 12
                    height: 16
                    content:
                        $ref: '#/spec/panels/log-lines'
                  - x: 12
                    y: 8
                    width: 12
                    height: 16
                    content:
                        $ref: '#/spec/panels/traces'
