# The Valkey the cache and the optional drivers run on, read from the
# redis-exporter (Valkey speaks the Redis protocol, and the exporter's metric
# names are redis_*). The instance label is the one the VictoriaMetrics scrape
# config names (redis-server-01).
#
# Native provisioning format: kind Dashboard with a project.
kind: Dashboard
metadata:
    name: valkey-cache
    project: tango
spec:
    display:
        name: Valkey Cache
    duration: 3h
    refreshInterval: 30s
    variables:
        - kind: ListVariable
          spec:
              display:
                  name: Instance
                  hidden: false
              allowAllValue: true
              allowMultiple: false
              plugin:
                  kind: PrometheusLabelValuesVariable
                  spec:
                      labelName: instance
                      matchers:
                          - redis_up
              name: instance
    panels:
        up:
            kind: Panel
            spec:
                display:
                    name: Exporter up
                plugin:
                    kind: StatChart
                    spec:
                        calculation: last-number
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'redis_up{instance=~"$instance"}'
        connected-clients:
            kind: Panel
            spec:
                display:
                    name: Connected clients
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'redis_connected_clients{instance=~"$instance"}'
        memory-used:
            kind: Panel
            spec:
                display:
                    name: Memory used
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            areaOpacity: 0.2
                            display: line
                        yAxis:
                          format:
                            unit: bytes
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'redis_memory_used_bytes{instance=~"$instance"}'
        keys:
            kind: Panel
            spec:
                display:
                    name: Keys stored
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'sum by (db) (redis_db_keys{instance=~"$instance"})'
        hit-ratio:
            kind: Panel
            spec:
                display:
                    name: Cache hit ratio
                    description: Keyspace hits against hits and misses together. A ratio that falls is a cache that stopped paying for itself.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                        yAxis:
                          format:
                            unit: percent
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(redis_keyspace_hits_total{instance=~"$instance"}[5m]) / (rate(redis_keyspace_hits_total{instance=~"$instance"}[5m]) + rate(redis_keyspace_misses_total{instance=~"$instance"}[5m]))'
        evictions:
            kind: Panel
            spec:
                display:
                    name: Evicted keys
                    description: Keys removed because the memory limit was reached — a non-zero rate on a cache this size is a capacity question.
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(redis_evicted_keys_total{instance=~"$instance"}[5m])'
        commands:
            kind: Panel
            spec:
                display:
                    name: Commands per second
                plugin:
                    kind: TimeSeriesChart
                    spec:
                        visual:
                            display: line
                queries:
                    - kind: TimeSeriesQuery
                      spec:
                          plugin:
                              kind: PrometheusTimeSeriesQuery
                              spec:
                                  query: 'rate(redis_commands_processed_total{instance=~"$instance"}[5m])'
    layouts:
        - kind: Grid
          spec:
              items:
                  - x: 0
                    y: 0
                    width: 6
                    height: 4
                    content:
                        $ref: '#/spec/panels/up'
                  - x: 6
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/memory-used'
                  - x: 15
                    y: 0
                    width: 9
                    height: 4
                    content:
                        $ref: '#/spec/panels/hit-ratio'
                  - x: 0
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/connected-clients'
                  - x: 8
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/keys'
                  - x: 16
                    y: 4
                    width: 8
                    height: 8
                    content:
                        $ref: '#/spec/panels/commands'
                  - x: 0
                    y: 12
                    width: 24
                    height: 8
                    content:
                        $ref: '#/spec/panels/evictions'
