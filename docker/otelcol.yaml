# The collector the three signals share.
#
# One address receives logs, traces, and metrics, which is what otel.endpoint
# names. The three Victoria services each listen on their own port, so without a
# collector in between they would be three addresses — which is exactly the
# second configuration source otel.endpoint exists to prevent. Here the fan-out
# lives in the collector config, not in the application.
receivers:
  otlp:
    protocols:
      # Both protocols the application can be configured with, so switching
      # otel.protocol needs no change here: 4318 is the HTTP listener and 4317
      # the gRPC one.
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Bound what one export can hold, so a burst is shed by the collector rather
  # than growing the collector's memory without limit.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  # VictoriaLogs serves OTLP on /insert/opentelemetry/v1/logs, not the
  # protocol's own /v1/logs.
  otlphttp/logs:
    logs_endpoint: http://victoria-logs:9428/insert/opentelemetry/v1/logs
    encoding: proto
  # VictoriaTraces serves OTLP on /insert/opentelemetry/v1/traces.
  otlphttp/traces:
    traces_endpoint: http://victoria-traces:10428/insert/opentelemetry/v1/traces
    encoding: proto
  # VictoriaMetrics ingests OTLP metrics on /opentelemetry/v1/metrics.
  otlphttp/metrics:
    metrics_endpoint: http://victoria-metrics:8428/opentelemetry/v1/metrics
    encoding: proto

service:
  # The collector's own pipeline, scraped by VictoriaMetrics on job
  # otel-collector: accepted/dropped/sent per signal is the first place to look
  # when a signal stops arriving.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
