// Admin console RPCs: API keys, resource APIs, application
// configuration, and audit logs. TypeIDs are strings at the wire
// boundary; show-once secrets appear only in the response that issues
// them.
syntax = "proto3";

package tango.admin.v1;

import "common.proto";
import "federation.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/admin/v1;adminv1";

// Permission is one grantable API permission.
message Permission {
  string id = 1;
  string key = 2;
  string name = 3;
  optional string description = 4;
  optional bool allowed_for_cimd_clients = 5;
}

// API is one registered resource API with its permissions.
message API {
  string id = 1;
  string name = 2;
  string resource = 3;
  bool allow_cimd_clients = 4;
  repeated Permission permissions = 5;
  string created_at = 6;
  optional string updated_at = 7;
}

// APIKey is the stored key projection; the plaintext token never lives
// here.
message APIKey {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string expires_at = 4;
  string created_at = 5;
  optional string last_used_at = 6;
}

// APIKeySecret carries the plaintext key exactly once, in the create
// and renew responses only.
message APIKeySecret {
  APIKey api_key = 1;
  string token = 2;
}

// ConfigVariable is one editable setting. Environment-backed
// settings (SMTP relay, secrets, lifetimes) never appear here.
message ConfigVariable {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_STRING = 1;
    TYPE_INT = 2;
    TYPE_BOOL = 3;
  }
  string key = 1;
  Type type = 2;
  string value = 3;
  optional bool is_public = 4;
}

// AuditLog is one audited event with its actor and request context.
message AuditLog {
  string id = 1;
  string event = 2;
  string trigger = 3;
  string status = 4;
  optional google.protobuf.Struct payload = 5;
  optional string resource_type = 6;
  optional string resource_id = 7;
  optional string user_id = 8;
  optional string ip_address = 9;
  optional string user_agent = 10;
  optional string device = 11;
  string created_at = 12;
}

// ApiKeyService administers machine credentials.
service ApiKeyService {
  rpc List(common.v1.PageRequest) returns (ListApiKeysResponse);
  rpc Create(CreateApiKeyRequest) returns (APIKeySecret);
  rpc Renew(RenewApiKeyRequest) returns (APIKeySecret);
  rpc Delete(DeleteApiKeyRequest) returns (google.protobuf.Empty);
}

message ListApiKeysResponse {
  repeated APIKey api_keys = 1;
  common.v1.ResponseMetadata metadata = 2;
}

message CreateApiKeyRequest {
  string name = 1;
  optional string description = 2;
  string expires_at = 3;
}

message RenewApiKeyRequest {
  string id = 1;
  string expires_at = 2;
}

message DeleteApiKeyRequest {
  string id = 1;
}

// ApiService administers resource APIs and their client grants.
service ApiService {
  rpc ListApis(common.v1.PageRequest) returns (ListApisResponse);
  rpc CreateApi(CreateApiRequest) returns (API);
  rpc GetApi(GetApiRequest) returns (API);
  rpc UpdateApi(UpdateApiRequest) returns (API);
  rpc DeleteApi(DeleteApiRequest) returns (google.protobuf.Empty);
  rpc SetPermissions(SetPermissionsRequest) returns (google.protobuf.Empty);
  rpc SetCimdAccess(SetCimdAccessRequest) returns (google.protobuf.Empty);
  rpc ListAssignableClients(ListApiClientsRequest) returns (ListClientRefsResponse);
  rpc ListClients(ListApiClientsRequest) returns (ListClientRefsResponse);
  rpc GrantClient(GrantClientRequest) returns (google.protobuf.Empty);
  rpc RevokeClient(RevokeClientRequest) returns (google.protobuf.Empty);
  rpc ListApisForClient(ListClientApisRequest) returns (ListClientApiGrantsResponse);
  rpc ListAssignableApisForClient(ListClientApisRequest) returns (ListApisResponse);
}

// ListApiClientsRequest addresses the client-grant surface of one API.
// The grant list grows with the deployment's client count, so it
// carries the shared page window.
message ListApiClientsRequest {
  string api_id = 1;
  common.v1.PageRequest page = 2;
}

// ListClientApisRequest addresses the grant surface of one relying-party
// client. The list grows with the deployment's API count, so it carries
// the shared page window.
message ListClientApisRequest {
  string client_id = 1;
  common.v1.PageRequest page = 2;
}

// ClientApiGrant is one client's access to an API with the per-subject
// permission split; the CIMD columns are computed from the API flag
// plus its permission allowlist.
message ClientApiGrant {
  API api = 1;
  bool client_access = 2;
  repeated string client_permission_ids = 3;
  bool user_delegated_access = 4;
  repeated string user_delegated_permission_ids = 5;
  bool cimd_granted_access = 6;
  repeated string cimd_granted_permission_ids = 7;
}

// ListClientApiGrantsResponse lists one client's API grants.
message ListClientApiGrantsResponse {
  repeated ClientApiGrant grants = 1;
  common.v1.ResponseMetadata metadata = 2;
}

message ListApisResponse {
  repeated API apis = 1;
  common.v1.ResponseMetadata metadata = 2;
}

message CreateApiRequest {
  string name = 1;
  string resource = 2;
  optional bool allow_cimd_clients = 3;
}

message GetApiRequest {
  string id = 1;
}

message UpdateApiRequest {
  string id = 1;
  optional string name = 2;
  optional string resource = 3;
}

message DeleteApiRequest {
  string id = 1;
}

message SetPermissionsRequest {
  string id = 1;
  // Atomic replacement: the grant set becomes exactly these.
  repeated string permission_ids = 2;
}

message SetCimdAccessRequest {
  string id = 1;
  bool allowed_for_cimd_clients = 2;
  repeated string permission_ids = 3;
}

// ListClientRefsResponse lists the clients holding a grant on one API.
message ListClientRefsResponse {
  repeated federation.v1.ClientRef clients = 1;
  common.v1.ResponseMetadata metadata = 2;
}

message GrantClientRequest {
  string api_id = 1;
  string client_id = 2;
  bool user_delegated_access = 3;
  repeated string user_delegated_permission_ids = 4;
  bool client_access = 5;
  repeated string client_permission_ids = 6;
}

message RevokeClientRequest {
  string api_id = 1;
  string client_id = 2;
}

// ApplicationConfigurationService reads and updates admin-editable
// settings backed by the appconfig surface.
service ApplicationConfigurationService {
  rpc Get(google.protobuf.Empty) returns (ListConfigVariablesResponse);
  rpc GetAll(google.protobuf.Empty) returns (ListConfigVariablesResponse);
  rpc Update(UpdateConfigVariablesRequest) returns (ListConfigVariablesResponse);
  rpc TestEmail(google.protobuf.Empty) returns (google.protobuf.Empty);
}

message ListConfigVariablesResponse {
  repeated ConfigVariable variables = 1;
}

message UpdateConfigVariablesRequest {
  repeated ConfigVariable variables = 1;
}

// AuditLogService reads audited events.
service AuditLogService {
  rpc List(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc ListAll(ListAuditLogsRequest) returns (ListAuditLogsResponse);
  rpc FilterOptions(FilterOptionsRequest) returns (FilterOptionsResponse);
}

message ListAuditLogsRequest {
  common.v1.PageRequest page = 1;
  optional string event = 2;
  optional string user_id = 3;
  optional string from = 4;
  optional string to = 5;
}

message ListAuditLogsResponse {
  repeated AuditLog logs = 1;
  common.v1.ResponseMetadata metadata = 2;
}

message FilterOptionsRequest {
  // Filter facet: "client-names" or "users".
  string kind = 1;
}

message FilterOptionsResponse {
  repeated string values = 1;
}
