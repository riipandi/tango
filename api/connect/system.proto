// Canonical internal RPC contract for transport-owned system surfaces.
// The public health endpoints stay REST; HealthService exists only as
// the Connect transport smoke target.
syntax = "proto3";

package tango.system.v1;

option go_package = "github.com/riipandi/tango/gen/proto/go/tango/system/v1;systemv1";

// HealthService is the transport smoke target for the /rpc mount.
service HealthService {
  rpc Check(CheckRequest) returns (CheckResponse);
}

message CheckRequest {}

message CheckResponse {
  string status = 1;
}
