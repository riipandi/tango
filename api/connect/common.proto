// Shared wire types the RPC list responses carry.
//
// The two transports answer one contract (docs/api-response.md): REST writes
// the envelope in pkg/responder, and ConnectRPC answers in its own idiom —
// status and correlation over the protocol (error codes, headers), the
// pagination block here, under the declared proto field names. The service
// codec in internal/transport serializes under those names, so a field here
// spells the same snake_case key the REST envelope emits.
syntax = "proto3";

package tango.common.v1;

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/common/v1;commonv1";

// Status is the outcome block a response carries: the word the client checks
// — success, always, because a failed call never reaches a response body —
// and the human-readable sentence a UI can show as-is. It mirrors the status
// and message keys the REST envelope emits, so a client reads the same shape
// on both transports. The correlation id and the rate-limit window stay with
// the protocol: they are per-request facts, not per-procedure ones.
message Status {
  // status is the outcome word, always `success` in a response body.
  string status = 1;

  // message is the human-readable sentence describing what the call did.
  string message = 2;
}

// ListMetadata is the pagination block a list response carries, flat like the
// REST envelope's metadata. The item indices are zero-based and inclusive,
// and both are omitted when the range is unknown.
message ListMetadata {
  // page is the current page number.
  optional int32 page = 1;

  // limit is the number of items per page.
  optional int32 limit = 2;

  // total_pages is optional when the total is unknown.
  optional int32 total_pages = 3;

  // total_items is optional for the same reason.
  optional int32 total_items = 4;

  // first_item_index is zero-based and inclusive.
  optional int32 first_item_index = 5;

  // last_item_index is zero-based and inclusive.
  optional int32 last_item_index = 6;
}
