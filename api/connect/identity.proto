// The identity contract: the procedures that create and manage accounts.
//
// Sign-up creates an account from a signup token an operator issued. The
// account carries its primary credential from the first call — the password
// the caller chose — so it can sign in immediately; email verification is a
// later procedure and the account is created unverified.
//
// The failure codes follow docs/api-response.md: a refused signup token is
// `permission_denied`, an account that already exists is `already_exists`,
// and a malformed field is `invalid_argument` with the typed violations the
// protovalidate constraints produce.
syntax = "proto3";

package tango.identity.v1;

import "buf/validate/validate.proto";
import "common.proto";

option go_package = "github.com/riipandi/tango/codegen/proto/go/tango/identity/v1;identityv1";

// SignupService creates accounts and administers the tokens sign-up requires.
service SignupService {
  // Signup creates an account from a valid signup token.
  //
  // The token is a raw value an operator issued once and is stored server-side
  // only as a hash, so a database leak cannot replay it. A token that is
  // unknown, expired, or spent answers the same failure, so the endpoint does
  // not disclose which half was wrong. The username is case-insensitive and
  // the email is matched exactly, the way their unique indexes are.
  rpc Signup(SignupRequest) returns (SignupResponse);

  // CreateSignupToken issues the signup token an account is created under.
  // It is an administrative procedure: the caller must carry a Bearer token
  // whose claims name an administrator, and a leaked machine credential is
  // no substitute, so a leaked key cannot mint account invitations.
  //
  // The raw token is generated here and returned once; only its hash is
  // stored, so no later procedure can read it back.
  rpc CreateSignupToken(CreateSignupTokenRequest) returns (CreateSignupTokenResponse);

  // ListSignupTokens answers the issued tokens with their usage counters.
  // The raw values are absent on purpose: they were shown once, at creation,
  // and only their hashes live in the database.
  rpc ListSignupTokens(ListSignupTokensRequest) returns (ListSignupTokensResponse);

  // DeleteSignupToken revokes an issued token. A spent or expired token needs
  // no deletion — the consumption rules refuse it — so this exists for an
  // invitation withdrawn before its window closes.
  rpc DeleteSignupToken(DeleteSignupTokenRequest) returns (DeleteSignupTokenResponse);
}

// SignupRequest carries the account fields and the signup token. The
// constraints below mirror what the users table enforces, so a bad field is
// refused with its name before the database is reached.
message SignupRequest {
  // username is the account's handle: 3-32 characters of ASCII letters,
  // digits, and underscores, matched case-insensitively.
  string username = 1 [(buf.validate.field).string.pattern = "^[a-zA-Z0-9_]{3,32}$"];

  // email is the account's address, matched exactly.
  string email = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"];

  // password is the account's primary credential, in clear text. The field
  // travels only over TLS and is never logged.
  string password = 3 [(buf.validate.field).string.min_len = 1];

  // token is the raw signup token the account is created under.
  string token = 4 [(buf.validate.field).string.min_len = 1];

  // first_name is the optional given name the account displays.
  optional string first_name = 5 [(buf.validate.field).string.max_len = 100];

  // last_name is the optional family name the account displays.
  optional string last_name = 6 [(buf.validate.field).string.max_len = 100];
}

// SignupResponse is the account the token created.
message SignupResponse {
  // user is the created account's view.
  User user = 1;
}

// User is the account view a sign-up answers with. It carries the fields a
// client renders, not the row: no password hash, no ban bookkeeping.
message User {
  // id is the account's identifier, a UUID string.
  string id = 1;

  // username is the account's handle, case preserved.
  string username = 2;

  // email is the account's address.
  string email = 3;

  // display_name is the name shown in the UI.
  string display_name = 4;
}

// SignupToken is the issued token's view. It carries the counters an operator
// manages, never the raw value: a token is shown once, in the creation
// response, and only its hash is stored.
//
// TODO(signup): user_groups joins an issued token to the groups its sign-ups
// join, per the upstream shape; deferred until the usergroup feature lands.
message SignupToken {
  // id is the token row's identifier, a UUID string.
  string id = 1;

  // usage_limit is how many sign-ups the token admits.
  int32 usage_limit = 2;

  // usage_count is how many sign-ups have used it.
  int32 usage_count = 3;

  // created_at is the issue time, RFC 3339.
  string created_at = 4;

  // expires_at is the instant the token stops admitting sign-ups, RFC 3339.
  string expires_at = 5;
}

// CreateSignupTokenRequest carries the token's window and budget.
message CreateSignupTokenRequest {
  // ttl_seconds is how long the token admits sign-ups, in seconds: between
  // one hour and thirty days.
  int32 ttl_seconds = 1 [(buf.validate.field).int32 = {
    gte: 3600
    lte: 2592000
  }];

  // usage_limit is how many sign-ups the token admits. Unset means the
  // single invitation; when set it is between 1 and 1000.
  optional int32 usage_limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }];
}

// CreateSignupTokenResponse is the issued token. raw_token is the only place
// the value exists: it is not stored and cannot be read back.
message CreateSignupTokenResponse {
  // token is the issued token's view.
  SignupToken token = 1;

  // raw_token is the value an invitation carries. Show it once.
  string raw_token = 2;
}

// ListSignupTokensRequest carries the page the caller asks for. Both fields
// unset answer the first default-sized page.
message ListSignupTokensRequest {
  // page is the one-based page number.
  optional int32 page = 1;

  // limit is the page size.
  optional int32 limit = 2;
}

// ListSignupTokensResponse is the issued tokens and their pagination block.
message ListSignupTokensResponse {
  // tokens are the issued tokens, newest first.
  repeated SignupToken tokens = 1;

  // metadata is the pagination block the list responses carry.
  tango.common.v1.ListMetadata metadata = 2;
}

// DeleteSignupToken names the token to revoke.
message DeleteSignupTokenRequest {
  // id is the token row's identifier, the UUID string the list answered.
  string id = 1;
}

// DeleteSignupTokenResponse is empty: a successful deletion says so with the
// protocol, and a missed one with the not-found code.
message DeleteSignupTokenResponse {}
