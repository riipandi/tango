bodyType: application/json
description: |-
  Replace an account's fields. Every field is specified: the names are mandatory, and an absent locale clears its column. The ban fields are one unit — ban_expires present applies the ban, absent lifts it.

  Ported from Pocket ID `PUT /api/users/{id}` as the `tango.identity.v1.UserService/UpdateUser` procedure.

  Parameters:
  - id (body, required): User ID
  - username (body, required): Account handle
  - email (body, required): Account address
  - first_name (body, required): Given name
  - last_name (body, required): Family name
  - display_name (body, required): Name the UI shows
  - ban_expires (body, optional): RFC 3339 instant the ban lifts
