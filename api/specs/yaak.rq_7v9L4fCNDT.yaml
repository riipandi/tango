description: |-
  Get a paginated list of OIDC clients that may reach the API, with their permissions split into user-delegated and client (machine-to-machine) access

  Mirror of Pocket ID `GET /api/apis/{id}/clients`.

  Parameters:
  - id (path, required): API ID
  - search (query, optional): Search term to filter clients by name
  - pagination[page] (query, optional): Page number for pagination
  - pagination[limit] (query, optional): Number of items per page
  - sort[column] (query, optional): Column to sort by
  - sort[direction] (query, optional): Sort direction (asc or desc)
