description: |-
  Update a specific user's profile picture.

  Ported from Pocket ID `PUT /api/users/{id}/profile-picture` — the write
  stays a REST route, because a file upload is a browser's form job, not a
  protocol procedure. Requires a Bearer token of the account's owner or an
  administrator; the body is the raw image bytes, checked against their
  magic bytes — PNG, JPEG, or WebP, at most 2 MiB. The engine stages the
  bytes and lands them on the storage backend through the durable queue.

  Parameters:
  - id (path, required): User ID
  - data (bytes, required): base64-encoded image bytes
