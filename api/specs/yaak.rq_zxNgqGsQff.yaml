bodyType: application/json
description: |-
  Update a specific user's profile picture.

  Ported from Pocket ID `PUT /api/users/{id}/profile-picture` as the
  `UpdateProfilePicture` procedure. Requires a Bearer token of the account's
  owner or an administrator; the image bytes travel base64-encoded in the
  request and are checked against their magic bytes — PNG, JPEG, or WebP, at
  most 2 MiB. The engine stages the bytes and lands them on the storage
  backend through the durable queue.

  Parameters:
  - userId (string, required): User ID
  - data (bytes, required): base64-encoded image bytes
