description: |-
  Replace the group's member set with the accounts the request names. An empty list empties the group.

  Ported from Pocket ID `PUT /api/user-groups/{id}/users` as the `tango.identity.v1.UserGroupService/SetUserGroupMembers` procedure.

  Parameters:
  - id (body, required): user group ID
  - user_ids (body, required): user IDs; every one must name an account
