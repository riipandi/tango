  text: |-
    {
      "identity": "${[ prompt.text(label='Identity', store='none', namespace='${[ctx.workspace()]}', ttl='0', placeholder='Email or username', defaultValue='${[ identity ]}') ]}",
      "password": "${[ prompt.text(label='Password', store='none', namespace='${[ctx.workspace()]}', ttl='0', defaultValue='${[ password ]}', placeholder='Password', password=true) ]}",
      "remember": ${[ remember ]}
    }
bodyType: application/json
description: |-
  Verifies the primary credential — the account's username (case-insensitive) or email (exact) plus its password — and issues the token pair: a stateless Bearer access token (JWT, verified against /.well-known/jwks.json) and a refresh token stored server-side only as a SHA-256 hash.

  tango-only: upstream Pocket ID signs users in with passkeys; password authentication is the tango adaptation.

  Parameters:
  - identity (body, required): the account's username or email address.
  - password (body, required): the primary credential, in clear text; TLS only, never logged.
  - remember (body, optional): selects the refresh lifetime — auth.refresh_short_ttl (12h default) when false, auth.refresh_long_ttl (14 days default) when true.

  A wrong identity and a wrong password answer the same failure (unauthenticated).
