# glauth LDAP server for local development (phase 8 LDAP sync testing).
# Postgres backend via the bundled plugin — schema (users, ldapgroups,
# includegroups, capabilities) is created by the plugin on first start.

#################
# General configuration.
debug = true

#################
# Server configuration.
[ldap]
  enabled = true
  listen = "0.0.0.0:3893"
  tls = false

[ldaps]
  enabled = false

#################
# Backend: postgres plugin.
[backend]
  datastore = "plugin"
  plugin = "/app/postgres.so"
  pluginhandler = "NewPostgresHandler"
  database = "host=pgsql port=5432 dbname=glauth user=postgres password=securedb sslmode=disable"
  baseDN = "dc=tango,dc=local"
  nameformat = "uid"
  groupformat = "cn"
  anonymousdse = true

#################
# REST API (health + config inspection).
[api]
  enabled = true
  tls = false
  listen = "0.0.0.0:5555"

#################
# Seed directory matching the phase-8 sync fixtures:
# groups first, then users (passsha256 of "syncpass" for all).
# 6478579e... = sha256("dogood") in the upstream docs examples.
[[users]]
  name = "svcldap"
  mail = "svcldap@tango.local"
  uidnumber = 5001
  primarygroup = 5501
  passsha256 = "652c7dc687d98c9889304ed2e408c74b611e86a40caa51c4b43f1dd5913c5cd0" # mysecret
  [[users.capabilities]]
    action = "search"
    object = "*"

