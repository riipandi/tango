# yaml-language-server: $schema=https://lefthook.dev/schema/lefthook.json

pre-commit:
  commands:
    format-js:
      glob: "*.{ts,tsx,js,jsx,css,md,json,yml,yaml}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true
    format-go:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true
    lint-js:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    # The Yaak export is committed, so a credential typed into a request body
    # would land in git; the guard rejects literals and accepts REPLACE_*
    # placeholders and ${[ env_var ]} references.
    yaak-secrets:
      glob: "api/specs/*.yaml"
      run: ./scripts/check-yaak-secrets.sh {staged_files}
