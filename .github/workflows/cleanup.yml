# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Cleanup

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Delete caches unused for more than this many days (default: 14)"
        required: false
        type: number
        default: 14
      all:
        description: "Delete all caches, ignoring the days threshold"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: write

jobs:
  clean-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deleteAll = ${{ inputs.all == true }};
            const maxAgeDays = Number(${{ inputs.days || 14 }});
            const CACHE_MAX_AGE_MS = maxAgeDays * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            let deleted = 0, skipped = 0, failed = 0;

            const isRateLimited = (err) => {
              const status = err && (err.status || (err.response && err.response.status));
              const msg = String((err && err.message) || '');
              return status === 429 || (status === 403 && /rate limit/i.test(msg));
            };

            // Retry transient rate-limit errors with a 60s backoff.
            const call = async (fn) => {
              for (let attempt = 0; ; attempt++) {
                try {
                  return await fn();
                } catch (err) {
                  if (isRateLimited(err) && attempt < 20) {
                    console.log(`Rate limited; sleeping 60s (attempt ${attempt + 1}/20)`);
                    await sleep(60_000);
                    continue;
                  }
                  throw err;
                }
              }
            };

            const listFirstPage = async () => {
              const { data } = await call(() => api.rest.actions.getActionsCacheList({
                owner, repo, per_page: 100, page: 1,
              }));
              return data.actions_caches;
            };

            // GITHUB_TOKEN allows 1000 req/h (~16/min); throttle to one
            // request every 4s to stay under the limit.
            const deleteCaches = async (caches) => {
              for (const cache of caches) {
                try {
                  await call(() => api.rest.actions.deleteActionsCacheById({
                    owner, repo, cache_id: cache.id,
                  }));
                  deleted++;
                } catch (err) {
                  failed++;
                  console.warn(`Failed ${cache.id} ${cache.key}: ${err.message}`);
                }
                await sleep(4000);
              }
            };

            if (deleteAll) {
              // Deleting shifts the remaining entries, so re-list from page 1
              // after every pass until nothing is left.
              for (let pass = 0; pass < 500; pass++) {
                const entries = await listFirstPage();
                if (entries.length === 0) break;
                console.log(`Pass ${pass + 1}: ${entries.length} caches to delete`);
                await deleteCaches(entries);
              }
            } else {
              // Collect every page first (no deletions during pagination →
              // no page shift), then delete the stale ones.
              const toDelete = [];
              for (let page = 1; page <= 10; page++) {
                const { data } = await call(() => api.rest.actions.getActionsCacheList({
                  owner, repo, per_page: 100, page,
                }));
                if (data.actions_caches.length === 0) break;
                for (const cache of data.actions_caches) {
                  const lastUsed = new Date(cache.last_accessed_at || cache.created_at).getTime();
                  if (now - lastUsed > CACHE_MAX_AGE_MS) toDelete.push(cache);
                  else skipped++;
                }
              }
              await deleteCaches(toDelete);
            }

            const remaining = await listFirstPage();
            console.log(
              `Deleted ${deleted}, skipped ${skipped}, failed ${failed}. ` +
              `Remaining visible caches: ${remaining.length}.`
            );
