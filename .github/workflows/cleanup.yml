# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Cleanup

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Delete caches unused for more than this many days (default: 14)"
        required: false
        type: number
        default: 14
      all:
        description: "Delete all caches, ignoring the days threshold"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: write
  contents: read

jobs:
  clean-cache:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Clean up GitHub Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          DELETE_ALL: ${{ inputs.all == true }}
          MAX_AGE_DAYS: ${{ inputs.days || 14 }}
        run: |
          set -euo pipefail

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          NOW=$(date +%s)
          MAX_AGE_SEC=$((MAX_AGE_DAYS * 86400))
          CUTOFF=$((NOW - MAX_AGE_SEC))

          echo "Repository: $OWNER/$REPO"
          echo "Delete all: $DELETE_ALL"
          echo "Max age: $MAX_AGE_DAYS days (cutoff: $(date -d @$CUTOFF -u))"

          # List all caches (gh returns JSON with pagination handled)
          CACHES_JSON=$(gh api --paginate "/repos/$OWNER/$REPO/actions/caches" --jq '.actions_caches[] | {id, key, last_accessed_at, created_at, size_in_bytes}')

          if [ -z "$CACHES_JSON" ]; then
            echo "No caches found"
            exit 0
          fi

          DELETED=0
          SKIPPED=0
          FAILED=0

          # Process each cache
          echo "$CACHES_JSON" | jq -c '.' | while IFS= read -r cache; do
            ID=$(echo "$cache" | jq -r '.id')
            KEY=$(echo "$cache" | jq -r '.key')
            LAST_ACCESSED=$(echo "$cache" | jq -r '.last_accessed_at')
            CREATED_AT=$(echo "$cache" | jq -r '.created_at')
            SIZE=$(echo "$cache" | jq -r '.size_in_bytes')

            # Determine last used time (prefer last_accessed_at, fallback to created_at)
            LAST_USED="${LAST_ACCESSED:-$CREATED_AT}"
            LAST_USED_SEC=$(date -d "$LAST_USED" +%s 2>/dev/null || echo "$NOW")

            SHOULD_DELETE=false
            if [ "$DELETE_ALL" = "true" ]; then
              SHOULD_DELETE=true
            elif [ "$LAST_USED_SEC" -lt "$CUTOFF" ]; then
              SHOULD_DELETE=true
            else
              SHOULD_DELETE=false
            fi

            if [ "$SHOULD_DELETE" = "true" ]; then
              echo "Deleting cache $ID ($KEY, last used: $LAST_USED, size: $SIZE bytes)"
              if gh api --silent -X DELETE "/repos/$OWNER/$REPO/actions/caches/$ID"; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
                echo "Failed to delete cache $ID ($KEY)" >&2
              fi
              # Throttle to stay under rate limit (1000 req/h = ~16/min)
              sleep 4
            else
              SKIPPED=$((SKIPPED + 1))
              echo "Skipping cache $ID ($KEY, last used: $LAST_USED)"
            fi
          done

          # Get remaining count
          REMAINING=$(gh api "/repos/$OWNER/$REPO/actions/caches" --jq '.total_count')
          echo "Deleted: $DELETED, Skipped: $SKIPPED, Failed: $FAILED, Remaining: $REMAINING"
