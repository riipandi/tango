# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# git tag -d v0.0.1
# git push origin --delete v0.0.1
#
# git tag v0.0.1 -m "version bump"
# git push origin v0.0.1

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

# Cancel in progress workflows on pull_requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: true
  LEFTHOOK: 0
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  create-release:
    name: Create Release
    # Intel image: tests use testcontainers, which needs QEMU (the ARM
    # image lacks nested virtualization for VZ).
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run actions/setup-sdk@local
        id: setup-sdk
        uses: ./.github/setup-sdk
        with:
          goVersion: 1.27.1

      - name: Install dependencies
        run: |
          if [[ "${{ steps.setup-sdk.outputs.nodeModules }}" != "true" ]]; then
            pnpm install --ignore-scripts --frozen-lockfile
          fi
          go mod download && go mod tidy
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Generate email template
        run: pnpm exec vite build
        env:
          TANGO_SKIP_GO: 1

      # The integration tests run Postgres 18 containers; the distro pg_dump
      # (16) refuses to talk to an 18 server, so install a matching client.
      - name: Install PostgreSQL 18 client (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo dd of=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

      # macOS runner images ship neither Docker nor the Postgres client; the
      # integration tests need both (testcontainers + pg_dump 18). The Intel
      # image runs colima through QEMU (no nested virtualization required);
      # colima needs the qemu formula for qemu-img. Homebrew downloads are
      # cached because installing qemu/colima is slow.
      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      # Homebrew auto-update and unpacking the qemu/colima bottles dominate
      # the macOS setup time. Cache the installed Cellar so `brew install`
      # becomes a no-op after the first run; the downloads cache above only
      # helps a cold Cellar miss.
      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/Cellar
            /usr/local/opt
          key: homebrew-cellar-${{ runner.os }}-v1-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Setup Docker and PostgreSQL client (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --quiet docker colima qemu postgresql@18
          brew link --force --overwrite docker colima qemu postgresql@18 || true
          colima start --cpu 3 --memory 6 --vm-type qemu
          echo "$(brew --prefix postgresql@18)/bin" >> $GITHUB_PATH
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> $GITHUB_ENV

      # Pulling images through QEMU networking is slow; persist them between
      # runs. Linux skips this — direct pulls are faster than save/load.
      - name: Cache testcontainers images (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: /tmp/tc-images
          key: tc-images-${{ runner.os }}-${{ hashFiles('pkg/testutils/*.go') }}
          restore-keys: tc-images-${{ runner.os }}-

      - name: Restore testcontainers images (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          for f in /tmp/tc-images/*.tar; do
            [[ -e "$f" ]] || continue
            docker load --input "$f"
          done
          exit 0

      - name: Save testcontainers images (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p /tmp/tc-images
          docker image save --output /tmp/tc-images/postgres-18-alpine.tar docker.io/postgres:18-alpine || true
          docker image save --output /tmp/tc-images/silo.tar docker.io/pgsty/silo:latest || true
          docker image save --output /tmp/tc-images/mailpit.tar docker.io/axllent/mailpit:latest || true
          exit 0

      - name: Setup golangci-lint toolchain
        uses: golangci/golangci-lint-action@v9
        with:
          github-token: ${{ github.token }}
          install-mode: binary
          version: v2.13

      # Mirrors `task check lint` (Taskfile.yml).
      - name: Check code quality
        run: |
          go vet ./...
          pnpm exec oxfmt --check
          pnpm exec oxlint
          pnpm exec oxlint --fix .
          golangci-lint run -c .golangci.yml ./...
        env:
          NODE_ENV: production

      # Mirrors `task test:go` (Taskfile.yml).
      - name: Run unit tests (backend)
        run: gotestsum --format testname ./...
        env:
          NODE_ENV: production

      # Mirrors `task test:go:debug` (Taskfile.yml).
      - name: Run unit tests (backend, debug tags)
        run: gotestsum --format testname -- -tags debug ./cmd/... ./database/...
        env:
          NODE_ENV: production

      # Code signing:
      # @ref: https://github.com/goreleaser/goreleaser-action?tab=readme-ov-file#signing
      # - name: Import GPG key
      #   id: import_gpg
      #   uses: crazy-max/ghaction-import-gpg@v6
      #   with:
      #     gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      #     passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          args: release --clean --skip=validate
          version: 2.14.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
