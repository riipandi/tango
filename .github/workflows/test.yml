# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["*"]
  pull_request:

permissions: read-all

env:
  CI: true
  LEFTHOOK: 0
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  test:
    name: Test
    strategy:
      matrix:
        # @ref: https://github.com/actions/runner-images
        os: [ubuntu-24.04, macos-15]
        go-version: ["1.27.1"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run actions/setup-sdk@local
        id: setup-sdk
        uses: ./.github/setup-sdk
        with:
          goVersion: ${{ matrix.go-version }}

      - name: Install dependencies
        run: |
          if [[ "${{ steps.setup-sdk.outputs.nodeModules }}" != "true" ]]; then
            pnpm install --ignore-scripts --frozen-lockfile
          fi
          go mod download && go mod tidy
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # The integration tests run pg_dump/pg_restore/psql inside the Postgres
      # container, so no host PostgreSQL client tools are needed.

      # macOS runner images ship neither Docker nor a VM runtime for it. Colima
      # with the Apple Virtualization framework (vz) runs the Linux VM without
      # QEMU emulation. Homebrew downloads are cached because installing
      # colima is slow.
      - name: Cache Homebrew downloads
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/api
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      # Homebrew auto-update and unpacking the colima bottles dominate
      # the macOS setup time. Cache the installed Cellar so `brew install`
      # becomes a no-op after the first run; the downloads cache above only
      # helps a cold Cellar miss.
      - name: Cache Homebrew packages (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            /usr/local/Cellar
            /usr/local/opt
          key: homebrew-cellar-${{ runner.os }}-v2-${{ hashFiles('.github/workflows/*.yml') }}

      - name: Setup Docker (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --quiet docker colima
          brew link --force --overwrite docker colima || true
          colima start --cpu 3 --memory 6 --vm-type vz
          echo "DOCKER_HOST=unix://$HOME/.colima/default/docker.sock" >> $GITHUB_ENV

      # Pulling images through the colima VM networking is slow; persist them
      # between runs. Linux skips this — direct pulls are faster than
      # save/load.
      - name: Cache testcontainers images (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: /tmp/tc-images
          key: tc-images-${{ runner.os }}-${{ hashFiles('pkg/testutils/*.go') }}
          restore-keys: tc-images-${{ runner.os }}-

      - name: Restore testcontainers images (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          for f in /tmp/tc-images/*.tar; do
            [[ -e "$f" ]] || continue
            docker load --input "$f"
          done
          exit 0

      - name: Save testcontainers images (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p /tmp/tc-images
          docker image save --output /tmp/tc-images/postgres-18-alpine.tar docker.io/postgres:18-alpine || true
          docker image save --output /tmp/tc-images/silo.tar docker.io/pgsty/silo:latest || true
          docker image save --output /tmp/tc-images/mailpit.tar docker.io/axllent/mailpit:latest || true
          exit 0

      - name: Generate email template
        run: pnpm exec vite build
        env:
          TANGO_SKIP_GO: 1

      - name: Setup golangci-lint toolchain
        uses: golangci/golangci-lint-action@v9
        with:
          github-token: ${{ github.token }}
          install-mode: binary
          version: v2.13

      # Mirrors `task check lint` (Taskfile.yml).
      - name: Check code quality
        run: |
          go vet ./...
          pnpm exec oxfmt --check
          pnpm exec oxlint
          golangci-lint run -c .golangci.yml ./...
          pnpm exec oxlint --fix .
        env:
          NODE_ENV: production

      # Mirrors `task typecheck` (Taskfile.yml).
      - name: Type check (TypeScript)
        run: pnpm exec tsc -b --noEmit
        env:
          NODE_ENV: production

      # Mirrors `task test:ui` (Taskfile.yml).
      - name: Run unit tests (frontend)
        run: pnpm exec vitest run
        env:
          NODE_ENV: production

      # Mirrors `task test:go` (Taskfile.yml).
      - name: Run unit tests (backend)
        run: gotestsum --format testname ./...
        env:
          NODE_ENV: production

      # Mirrors `task test:go:debug` (Taskfile.yml).
      - name: Run unit tests (backend, debug tags)
        run: gotestsum --format testname -- -tags debug ./cmd/... ./database/...
        env:
          NODE_ENV: production

      # Mirrors `task build` (Taskfile.yml).
      - name: Build application binaries
        run: pnpm exec vite build
        env:
          NODE_ENV: production
