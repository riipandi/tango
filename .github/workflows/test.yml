# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["*"]
  pull_request:

permissions: read-all

env:
  CI: true
  LEFTHOOK: 0
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: true
  CGO_ENABLED: 0

jobs:
  test:
    name: Test
    strategy:
      matrix:
        # @ref: https://github.com/actions/runner-images
        os: [ubuntu-24.04, macos-15]
        go-version: ["1.27.x"]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run actions/setup-sdk@local
        uses: ./.github/setup-sdk
        with:
          goVersion: ${{ matrix.go-version }}

      - name: Install dependencies
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          go mod download && go mod tidy
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # The integration tests run Postgres 18 containers; the distro pg_dump
      # (16) refuses to talk to an 18 server, so install a matching client.
      - name: Install PostgreSQL 18 client (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo dd of=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH

      - name: Generate email template
        run: pnpm exec vite build
        env:
          TANGO_SKIP_GO: 1

      - name: Setup golangci-lint toolchain
        uses: golangci/golangci-lint-action@v9
        with:
          github-token: ${{ github.token }}
          install-mode: binary
          version: v2.13

      # Mirrors `task check lint` (Taskfile.yml).
      - name: Check code quality
        run: |
          go vet ./...
          pnpm exec oxfmt --check
          pnpm exec oxlint
          golangci-lint run -c .golangci.yml ./...
          pnpm exec oxlint --fix .
        env:
          NODE_ENV: production

      # Mirrors `task typecheck` (Taskfile.yml).
      - name: Type check (TypeScript)
        run: pnpm exec tsc -b --noEmit
        env:
          NODE_ENV: production

      # Mirrors `task test:ui` (Taskfile.yml).
      - name: Run unit tests (frontend)
        run: pnpm exec vitest run
        env:
          NODE_ENV: production

      # Mirrors `task test:go` (Taskfile.yml).
      - name: Run unit tests (backend)
        run: gotestsum --format testname ./...
        env:
          NODE_ENV: production

      # Mirrors `task test:go:debug` (Taskfile.yml).
      - name: Run unit tests (backend, debug tags)
        run: gotestsum --format testname -- -tags debug ./cmd/... ./database/...
        env:
          NODE_ENV: production

      # Mirrors `task build` (Taskfile.yml).
      - name: Build application binaries
        run: pnpm exec vite build
        env:
          NODE_ENV: production
