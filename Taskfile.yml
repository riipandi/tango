# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

silent: true

vars:
  APP_NAME:
    sh: jq -r .name package.json 2>/dev/null || echo tango
  APP_VERSION:
    sh: jq -r .version package.json 2>/dev/null || echo 0.0.0
  IMAGE:
    sh: jq -r .config.image package.json 2>/dev/null || echo ghcr.io/riipandi/tango

# Every group lives in tasks/. Each include is flattened, so a task keeps
# the name it had when this file held it. That also keeps one flat namespace,
# so a task in one file can depend on a task in another by its plain name.
includes:
  dev:
    taskfile: ./tasks/dev.yml
    flatten: true
  build:
    taskfile: ./tasks/build.yml
    flatten: true
  database:
    taskfile: ./tasks/database.yml
    flatten: true
  cert:
    taskfile: ./tasks/cert.yml
    flatten: true
  test:
    taskfile: ./tasks/test.yml
    flatten: true
  lint:
    taskfile: ./tasks/lint.yml
    flatten: true
  rpc:
    taskfile: ./tasks/rpc.yml
    flatten: true
  deps:
    taskfile: ./tasks/deps.yml
    flatten: true
  cleanup:
    taskfile: ./tasks/cleanup.yml
    flatten: true
  docker:
    taskfile: ./tasks/docker.yml
    flatten: true

tasks:
  default:
    desc: List all available tasks
    cmd: task --list

  # ----------------------------------------------------------------------------
  # Docker compose
  # ----------------------------------------------------------------------------
  compose:up:
    desc: Start docker compose services
    cmd: docker compose -f docker/compose.yaml up --detach --remove-orphans

  compose:down:
    desc: Stop docker compose services
    cmd: docker compose -f docker/compose.yaml down --remove-orphans

  compose:cleanup:
    desc: Stop services and remove volumes
    cmds:
      - docker-compose -f docker/compose.yaml down --remove-orphans --volumes
      - pnpm dlx del-cli .storage/{mailpit_data,pgsql_data,redis_data,silo_data}

  compose:restart:
    desc: Restart docker compose services
    cmds:
      - task: compose:down
      - task: compose:up

  compose:reset:
    desc: Reset docker compose services
    cmds:
      - task: compose:cleanup
      - task: compose:up
