# yaml-language-server: $schema=https://json.schemastore.org/buf.gen.json

# ConnectRPC code generation. Plugin versions are pinned via @version
# for Go (module-resolved by `go run`); the TS plugin resolves through
# pnpm exec against the devDependencies. No globally installed
# binaries required. Contracts live in api/connect/*.proto; generated
# Go lands in gen/proto/go/ and is committed; generated TypeScript
# lands in app/generated/rpc/ (untracked) and is produced by the
# generation task before dev/build/typecheck. Connect-ES v2 has no
# separate plugin: protoc-gen-es emits the service descriptors with
# the message code.
version: v2

clean: true

plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
    out: gen/proto/go
    opt: module=github.com/riipandi/tango/gen/proto/go
  - local:
      - go
      - run
      - connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.21.0
    out: gen/proto/go
    opt: module=github.com/riipandi/tango/gen/proto/go
  - local:
      - pnpm
      - exec
      - protoc-gen-es
    out: app/generated/rpc
    opt: target=ts
